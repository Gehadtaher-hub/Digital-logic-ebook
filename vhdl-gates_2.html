<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive VHDL Laboratory</title><style>
:root{--bg:#071527;--p:#0e2238;--p2:#122b45;--t:#ebf7ff;--m:#9eb7ca;--a:#26d0ce;--v:#a78bfa;--c:#fb7185;--g:#fbbf24;--l:#28445e;--ok:#35d39a}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#061321,#10213b);color:var(--t)}header{padding:20px max(18px,4vw);background:#071527f2;border-bottom:3px solid var(--g);display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{margin:0}header p,.muted{color:var(--m)}a{color:var(--a)}main{max-width:1200px;margin:auto;padding:22px}.tabs,.controls{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0;align-items:center}.tab,.btn{border:1px solid var(--l);background:var(--p);color:var(--t);padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.tab.active,.btn.primary{background:var(--a);color:#04202d}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card,.panel{background:linear-gradient(145deg,var(--p),var(--p2));border:1px solid var(--l);border-radius:16px;padding:18px;margin:12px 0}.card p{color:var(--m);min-height:42px}.badge{background:var(--g);color:#071527;border-radius:999px;padding:4px 9px;font-size:.75rem;font-weight:900}.open{width:100%;border:0;border-radius:9px;padding:10px;background:var(--v);font-weight:900;cursor:pointer}.lesson{display:none}.lesson.show{display:block}.lessonTop{display:flex;justify-content:space-between;gap:12px}.labgrid{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:14px}.switch.on{background:var(--g);color:#071527}.led{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:#324452;border:7px solid #738795;font-weight:900}.led.on{background:#ffe45a;color:#071527;box-shadow:0 0 28px var(--g)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid var(--l);padding:8px;text-align:center}th{background:#071527}tr.live{background:#745f17;font-weight:900}pre{background:#020914;border:1px solid var(--l);border-radius:12px;overflow:auto;padding:13px;white-space:pre;color:#d9f2ff}.wave{width:100%;height:220px;background:#020914;border:1px solid var(--l);border-radius:12px}.activity{padding:25px;border:2px dashed #47758a;border-radius:13px;text-align:center}.gate{display:inline-block;background:var(--v);color:#100b28;padding:20px 32px;border-radius:10px 40px 40px 10px;margin:15px;font-weight:900}.answer{width:100%;min-height:85px;background:#071527;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:12px}.q,.exrow{background:var(--p);border:1px solid var(--l);border-radius:11px;padding:12px;margin:8px 0}.good{color:var(--ok)}.bad{color:var(--c)}label{display:block;padding:5px}@media(max-width:760px){header{display:block}.labgrid{grid-template-columns:1fr}.lessonTop{display:block}}
</style></head><body><header><div><h1>VHDL Interactive Learning Library</h1><p>Learn, simulate, test, and assess digital circuits.</p></div><a href="lectures.html">← Back to Lectures</a></header><main>
<nav id="mainTabs" class="tabs"><button class="tab active" data-view="library">Library</button><button class="tab" data-view="c2v">Circuit → VHDL</button><button class="tab" data-view="v2c">VHDL → Circuit</button><button class="tab" data-view="quiz">Random Quiz</button></nav>
<section id="library" class="view active"><div id="browse"><nav id="catTabs" class="tabs"><button class="tab active" data-cat="all">All</button><button class="tab" data-cat="basic">Basic Gates</button><button class="tab" data-cat="comb">Combinational</button><button class="tab" data-cat="seq">Sequential</button></nav><div id="cards" class="grid"></div></div><section id="lesson" class="lesson"></section></section>
<section id="c2v" class="view"><div class="panel"><h2>Circuit-to-VHDL</h2><div class="activity"><b id="cInputs"></b><span class="gate" id="cGate"></span><b>Y</b></div><textarea id="cAnswer" class="answer" placeholder="Y <= A and B;"></textarea><div class="controls"><button id="checkC2V" class="btn primary">Check answer</button><button id="newC2V" class="btn">New challenge</button><button id="hintC2V" class="btn">Hint</button></div><p id="cFeedback"></p></div></section>
<section id="v2c" class="view"><div class="panel"><h2>VHDL-to-Circuit</h2><pre id="vCode"></pre><div id="vOptions" class="grid"></div><p id="vFeedback"></p><button id="newV2C" class="btn">Next challenge</button></div></section>
<section id="quiz" class="view"><div class="panel"><h2>Random Quiz</h2><div class="controls"><select id="quizCount"><option value="5">5 questions</option><option value="10">10 questions</option></select><button id="startQuiz" class="btn primary">Generate quiz</button></div><div id="quizBox"></div><p id="quizScore"></p></div></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const circuits=[
{id:'buffer',cat:'basic',name:'Buffer',desc:'Copies A to Y.',inputs:['A'],stmt:'Y <= A;'},
{id:'not',cat:'basic',name:'NOT Gate',desc:'Complements A.',inputs:['A'],stmt:'Y <= not A;'},
{id:'and',cat:'basic',name:'AND Gate',desc:'HIGH only when A and B are HIGH.',inputs:['A','B'],stmt:'Y <= A and B;'},
{id:'or',cat:'basic',name:'OR Gate',desc:'HIGH when either input is HIGH.',inputs:['A','B'],stmt:'Y <= A or B;'},
{id:'nand',cat:'basic',name:'NAND Gate',desc:'Complement of AND.',inputs:['A','B'],stmt:'Y <= A nand B;'},
{id:'nor',cat:'basic',name:'NOR Gate',desc:'Complement of OR.',inputs:['A','B'],stmt:'Y <= A nor B;'},
{id:'xor',cat:'basic',name:'XOR Gate',desc:'HIGH when inputs differ.',inputs:['A','B'],stmt:'Y <= A xor B;'},
{id:'xnor',cat:'basic',name:'XNOR Gate',desc:'HIGH when inputs match.',inputs:['A','B'],stmt:'Y <= A xnor B;'},
{id:'tri',cat:'comb',name:'Tri-State Driver',desc:'Drives A when enabled.',inputs:['A','ENABLE'],stmt:"Y <= A when ENABLE = '1' else 'Z';"},
{id:'mux',cat:'comb',name:'2-to-1 Multiplexer',desc:'Selects A or B.',inputs:['A','B','SEL'],stmt:"Y <= A when SEL = '0' else B;"},
{id:'half',cat:'comb',name:'Half Adder',desc:'Produces SUM and CARRY.',inputs:['A','B'],stmt:'SUM <= A xor B;\nCARRY <= A and B;'},
{id:'full',cat:'comb',name:'Full Adder',desc:'Adds A, B, and CIN.',inputs:['A','B','CIN'],stmt:'SUM <= A xor B xor CIN;\nCOUT <= (A and B) or (CIN and (A xor B));'},
{id:'dff',cat:'seq',name:'D Flip-Flop',desc:'Captures D on a rising clock edge.',inputs:['D','RESET'],stmt:'Q <= D on rising_edge(CLK);'},
{id:'jkff',cat:'seq',name:'JK Flip-Flop',desc:'Hold, reset, set, or toggle.',inputs:['J','K','RESET'],stmt:'JK edge-triggered storage'},
{id:'register',cat:'seq',name:'4-bit Register',desc:'Stores data when LOAD is HIGH.',inputs:['D','LOAD','RESET'],stmt:'parallel register'},
{id:'counter',cat:'seq',name:'4-bit Counter',desc:'Counts on clock edges.',inputs:['ENABLE','RESET'],stmt:'binary counter'},
{id:'fsm',cat:'seq',name:'Two-State FSM',desc:'Transitions between IDLE and ACTIVE.',inputs:['X','RESET'],stmt:'finite state machine'}];
const labels={basic:'Basic Gate',comb:'Combinational',seq:'Sequential'};let active=null,state={Q:0};
function calc(c,s){const A=s.A||0,B=s.B||0,E=s.ENABLE||0,SEL=s.SEL||0,C=s.CIN||0;if(c.id==='buffer')return A;if(c.id==='not')return 1-A;if(c.id==='and')return A&B;if(c.id==='or')return A|B;if(c.id==='nand')return 1-(A&B);if(c.id==='nor')return 1-(A|B);if(c.id==='xor')return A^B;if(c.id==='xnor')return 1-(A^B);if(c.id==='tri')return E?A:'Z';if(c.id==='mux')return SEL?B:A;if(c.id==='half')return (A^B)+' / '+(A&B);if(c.id==='full')return (A^B^C)+' / '+((A&B)|(C&(A^B)));return state.Q||0}
function design(c){if(c.id==='dff')return "library ieee;\nuse ieee.std_logic_1164.all;\nentity dff is port(CLK, RESET, D: in std_logic; Q: out std_logic); end;\narchitecture rtl of dff is begin\n process(CLK, RESET) begin\n  if RESET='1' then Q<='0';\n  elsif rising_edge(CLK) then Q<=D; end if;\n end process;\nend rtl;";if(c.cat==='seq')return `library ieee;\nuse ieee.std_logic_1164.all;\nentity ${c.id} is port(CLK, RESET: in std_logic; Q: out std_logic); end;\narchitecture rtl of ${c.id} is begin\n -- ${c.name} teaching template\n process(CLK, RESET) begin\n  if RESET='1' then Q<='0';\n  elsif rising_edge(CLK) then null; end if;\n end process;\nend rtl;`;const outputs=c.id==='half'?'SUM, CARRY':c.id==='full'?'SUM, COUT':'Y';return `library ieee;\nuse ieee.std_logic_1164.all;\nentity ${c.id} is port(${c.inputs.join(', ')}: in std_logic; ${outputs}: out std_logic); end;\narchitecture rtl of ${c.id} is begin\n ${c.stmt}\nend rtl;`}
function testbench(c){return `library ieee;\nuse ieee.std_logic_1164.all;\nentity ${c.id}_tb is end;\narchitecture sim of ${c.id}_tb is\n -- Declare test signals here\nbegin\n uut: entity work.${c.id} port map(/* connect ports */);\n stimulus: process begin\n  -- Apply input values\n  wait for 10 ns;\n  wait;\n end process;\nend sim;`}
function render(cat='all'){$('cards').innerHTML=circuits.filter(c=>cat==='all'||c.cat===cat).map(c=>`<article class="card"><span class="badge">${labels[c.cat]}</span><h2>${c.name}</h2><p>${c.desc}</p><button class="open" data-open="${c.id}">Open interactive lesson</button></article>`).join('');document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>showLesson(b.dataset.open)))}
function showLesson(id){active=circuits.find(c=>c.id===id);active.inputs.forEach(k=>state[k]=0);state.Q=0;$('browse').style.display='none';$('lesson').classList.add('show');$('lesson').innerHTML=`<div class="lessonTop"><div><span class="badge">${labels[active.cat]}</span><h2>${active.name}</h2><p class="muted">${active.desc}</p></div><button id="backBtn" class="btn">← Library</button></div><div class="labgrid"><div class="panel"><h3>Interactive simulator</h3><div id="switches" class="controls"></div>${active.cat==='seq'?'<button id="clockBtn" class="btn primary">Clock pulse ↑</button>':''}<div id="outputLed" class="led">Y = 0</div><div id="truth"></div></div><div class="panel"><div class="controls"><button id="designBtn" class="btn primary">Design</button><button id="tbBtn" class="btn">Testbench</button><button id="copyBtn" class="btn">Copy</button><button id="downloadBtn" class="btn">Download .vhd</button></div><pre id="codeBox"></pre></div></div><div class="panel"><h3>Waveform</h3><canvas id="wave" class="wave" width="1050" height="220"></canvas></div><div class="panel"><h3>Line-by-line explanation</h3><div id="explain"></div></div>`;$('backBtn').addEventListener('click',goBack);$('designBtn').addEventListener('click',()=>showCode('design'));$('tbBtn').addEventListener('click',()=>showCode('tb'));$('copyBtn').addEventListener('click',copyCode);$('downloadBtn').addEventListener('click',downloadCode);if($('clockBtn'))$('clockBtn').addEventListener('click',pulse);showCode('design');updateSim();window.scrollTo(0,0)}
function showCode(kind){active.kind=kind;const txt=kind==='tb'?testbench(active):design(active);$('codeBox').textContent=txt;$('designBtn').classList.toggle('primary',kind==='design');$('tbBtn').classList.toggle('primary',kind==='tb');$('explain').innerHTML=txt.split('\n').map((l,i)=>`<div class="exrow"><b>Line ${i+1}</b>: <code>${escapeHTML(l||'(blank)')}</code><br>${explainLine(l)}</div>`).join('')}
function explainLine(l){const s=l.trim();if(!s)return 'Separates sections.';if(s.startsWith('library'))return 'Makes the IEEE library available.';if(s.startsWith('use '))return 'Imports standard logic definitions.';if(s.startsWith('entity'))return 'Declares the interface.';if(s.startsWith('architecture'))return 'Starts the implementation.';if(s.includes('rising_edge'))return 'Responds to a rising clock edge.';if(s.includes('<='))return 'Assigns a signal value.';if(s.startsWith('wait'))return 'Controls testbench simulation time.';return 'Defines part of the circuit or simulation.'}
function updateSim(){$('switches').innerHTML=active.inputs.map(k=>`<button class="btn switch ${state[k]?'on':''}" data-switch="${k}">${k} = ${state[k]}</button>`).join('');document.querySelectorAll('[data-switch]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.switch;state[k]=1-state[k];if(k==='RESET'&&state[k])state.Q=0;updateSim()}));const y=calc(active,state);$('outputLed').textContent=(active.cat==='seq'?'Q':'Y')+' = '+y;$('outputLed').classList.toggle('on',y===1||String(y).startsWith('1'));makeTruth();drawWave()}
function pulse(){if(state.RESET)state.Q=0;else if(active.id==='dff')state.Q=state.D;else if(active.id==='counter'&&state.ENABLE)state.Q=(state.Q+1)%16;else state.Q=state.D||state.J||state.X||0;updateSim()}
function makeTruth(){if(active.cat==='seq'){$('truth').innerHTML='<p class="muted">Change inputs, then press Clock pulse to update the stored output.</p>';return}const n=active.inputs.length;let rows='';for(let i=0;i<2**n;i++){const s={};active.inputs.forEach((k,j)=>s[k]=(i>>(n-1-j))&1);const live=active.inputs.every(k=>s[k]===state[k]);rows+=`<tr class="${live?'live':''}">${active.inputs.map(k=>`<td>${s[k]}</td>`).join('')}<td>${calc(active,s)}</td></tr>`}$('truth').innerHTML=`<table><tr>${active.inputs.map(k=>`<th>${k}</th>`).join('')}<th>Output</th></tr>${rows}</table>`}
function drawWave(){const c=$('wave'),x=c.getContext('2d'),signals=active.inputs.slice(0,3).concat(active.cat==='seq'?'Q':'Y');x.clearRect(0,0,c.width,c.height);x.font='15px Segoe UI';signals.forEach((name,r)=>{const base=30+r*45;x.fillStyle='#d9f2ff';x.fillText(name,10,base+12);x.strokeStyle=['#26d0ce','#fbbf24','#fb7185','#a78bfa'][r];x.lineWidth=3;x.beginPath();let old=0;for(let t=0;t<8;t++){const s={};active.inputs.forEach((k,j)=>s[k]=(t>>j)&1);let v=name==='Y'?calc(active,s):name==='Q'?(t>2&&t<6?1:0):s[name]||0;if(typeof v!=='number')v=String(v).startsWith('1')?1:0;const px=70+t*120,py=base+(v?0:21);if(t===0)x.moveTo(px,py);else{x.lineTo(px,base+(old?0:21));x.lineTo(px,py)}old=v}x.stroke()})}
function copyCode(){navigator.clipboard.writeText($('codeBox').textContent).then(()=>alert('Code copied.')).catch(()=>alert('Select and copy the code manually.'))}function downloadCode(){const a=document.createElement('a'),blob=new Blob([$('codeBox').textContent],{type:'text/plain'});a.href=URL.createObjectURL(blob);a.download=active.id+(active.kind==='tb'?'_tb':'')+'.vhd';a.click();URL.revokeObjectURL(a.href)}function goBack(){$('lesson').classList.remove('show');$('browse').style.display='block'}function escapeHTML(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
const activities=circuits.filter(c=>['buffer','not','and','or','nand','nor','xor','xnor','mux'].includes(c.id));let challenge;
function newC2V(){challenge=activities[Math.floor(Math.random()*activities.length)];$('cInputs').textContent='Inputs: '+challenge.inputs.join(', ')+' →';$('cGate').textContent=challenge.name;$('cAnswer').value='';$('cFeedback').textContent=''}function normalize(s){return s.toLowerCase().replace(/\s+/g,'')}function checkC2V(){const ok=normalize($('cAnswer').value)===normalize(challenge.stmt);$('cFeedback').textContent=ok?'✓ Correct VHDL!':'✗ Try again. Remember the signal assignment operator <= and semicolon.';$('cFeedback').className=ok?'good':'bad'}function hintC2V(){$('cFeedback').textContent='Hint: '+challenge.stmt.replace(/[^;]+;/,'Use the '+challenge.name+' operation.');$('cFeedback').className=''}
function newV2C(){challenge=activities[Math.floor(Math.random()*activities.length)];$('vCode').textContent=challenge.stmt;$('vFeedback').textContent='';let opts=[challenge,...activities.filter(c=>c.id!==challenge.id).sort(()=>Math.random()-.5).slice(0,4)].sort(()=>Math.random()-.5);$('vOptions').innerHTML=opts.map(c=>`<button class="card" data-choice="${c.id}"><b>${c.name}</b></button>`).join('');document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>checkV2C(b.dataset.choice)))}function checkV2C(id){const ok=id===challenge.id;$('vFeedback').textContent=ok?'✓ Correct circuit!':'✗ Read the VHDL operator again.';$('vFeedback').className=ok?'good':'bad'}
const bank=[['Which operator detects equal inputs?',['xor','xnor','nand'],1],['A testbench is used to…',['apply stimulus','create physical pins','replace the entity'],0],['A two-input truth table has…',['2 rows','4 rows','8 rows'],1],['Which assignment describes AND?',['Y <= A and B;','Y <= A or B;','Y <= not A;'],0],['rising_edge(CLK) detects…',['LOW-to-HIGH transition','any input change','reset'],0],['NAND is LOW for…',['00','01','11'],2],['A signal assignment uses…',['<=','==','++'],0],['UUT means…',['unit under test','universal utility type','unsigned timing'],0],['A multiplexer select signal…',['chooses an input','stores data forever','creates a clock'],0],['Reset usually…',['initializes stored state','adds bits','inverts inputs'],0]];let quiz=[];function startQuiz(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,+$('quizCount').value);$('quizBox').innerHTML=quiz.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}<p id="feedback${i}"></p></div>`).join('')+'<button id="submitQuiz" class="btn primary">Submit quiz</button>';$('submitQuiz').addEventListener('click',gradeQuiz);$('quizScore').textContent=''}function gradeQuiz(){let score=0;quiz.forEach((q,i)=>{const p=document.querySelector(`input[name="q${i}"]:checked`),ok=p&&+p.value===q[2],f=$('feedback'+i);if(ok)score++;f.textContent=!p?'Please answer.':ok?'✓ Correct':'✗ Correct answer: '+q[1][q[2]];f.className=ok?'good':'bad'});$('quizScore').textContent=`Score: ${score}/${quiz.length} (${Math.round(score/quiz.length*100)}%)`}
$('mainTabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;document.querySelectorAll('#mainTabs .tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.view).classList.add('active');if(b.dataset.view==='c2v')newC2V();if(b.dataset.view==='v2c')newV2C()});$('catTabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;document.querySelectorAll('#catTabs .tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.cat)});$('checkC2V').addEventListener('click',checkC2V);$('newC2V').addEventListener('click',newC2V);$('hintC2V').addEventListener('click',hintC2V);$('newV2C').addEventListener('click',newV2C);$('startQuiz').addEventListener('click',startQuiz);render();startQuiz();
</script></body></html>
