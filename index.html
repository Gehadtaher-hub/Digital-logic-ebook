<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foundations of Digital Circuits</title><style>:root{--ink:#263238;--navy:#18324a;--gold:#c59b45;--cream:#fffaf0;--line:#dbcba8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,serif;background:radial-gradient(circle at top,#fbf7ed,#e7dcc4 72%);color:var(--ink)}header{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,var(--navy),#244d6c);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 22px;border-bottom:5px solid var(--gold)}h1{font-size:clamp(20px,3vw,31px);margin:0}.subtitle{font-size:13px;color:#f1ddb0}.btn{border:1px solid #e8d39a;border-radius:999px;padding:10px 16px;font:750 14px system-ui;text-decoration:none;background:#fffaf0;color:var(--navy)}.wrap{padding:14px 18px;display:flex;flex-direction:column;align-items:center}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:12px;background:#fffaf0e8;border:1px solid var(--line);padding:9px 14px;border-radius:16px;font-family:system-ui}.toolbar button,.toolbar input{padding:9px 12px;border:1px solid #bda978;border-radius:9px;background:#fffdf7;font-weight:700}.book-shell{width:min(1240px,97vw);height:calc(100vh - 170px);min-height:300px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:8px}.flip-book{display:none;filter:drop-shadow(0 14px 20px #362a2260)}.page{background:var(--cream);box-shadow:inset 0 0 0 1px #cbb98e;overflow:hidden;position:relative}.page canvas{width:100%;height:100%;object-fit:contain;background:#fff}.loading{padding:34px;background:#fffaf0;border:1px solid var(--line);border-radius:18px;text-align:center}.error{color:#8a1c2e}.watermark{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#7a263a42;font:800 14px system-ui;pointer-events:none}@media(max-width:700px){header{flex-direction:column;align-items:flex-start}.book-shell{height:calc(100vh - 225px)}.wrap{padding:8px}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script></head><body><header><div><h1>Foundations of Digital Circuits</h1><div class="subtitle">An interactive academic reading experience</div></div><a class="btn" href="studio.html">Interactive Activities</a></header><main class="wrap"><div class="toolbar"><button id="prev">Previous</button><span id="status">Preparing book...</span><span>Click the right/left page side, swipe, drag a corner, or use controls</span><button id="next">Next</button><label>Page <input id="pageNo" type="number" min="1" value="1" style="width:70px"></label></div><div class="book-shell"><div id="loading" class="loading"><h2>Loading the eBook</h2><p>Pages are being prepared.</p></div><div id="book" class="flip-book"></div></div></main><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let book,total=0;async function init(){try{const pdf=await pdfjsLib.getDocument('digital_ebook.pdf').promise;total=pdf.numPages;const root=document.getElementById('book');for(let n=1;n<=total;n++){status.textContent='Preparing page '+n+' of '+total;const pg=await pdf.getPage(n),vp=pg.getViewport({scale:1.25}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const d=document.createElement('div');d.className='page';if(n===1)d.dataset.density='hard';d.appendChild(c);const w=document.createElement('div');w.className='watermark';w.textContent='Foundations of Digital Circuits';d.appendChild(w);root.appendChild(d)}loading.style.display='none';root.style.display='block';book=new St.PageFlip(root,{width:550,height:730,size:'stretch',minWidth:220,maxWidth:650,minHeight:280,maxHeight:760,showCover:true,mobileScrollSupport:false,usePortrait:true,drawShadow:true,flippingTime:700});book.loadFromHTML(document.querySelectorAll('.page'));book.on('flip',e=>{status.textContent='Page '+(e.data+1)+' of '+total;pageNo.value=e.data+1});status.textContent='Page 1 of '+total}catch(e){loading.innerHTML='<h2 class="error">The eBook could not be loaded</h2><p>Confirm that digital_ebook.pdf is in this folder.</p>'}}function goPage(){if(book)book.flip(Math.max(1,Math.min(total,+pageNo.value||1))-1)}prev.onclick=()=>book&&book.flipPrev();next.onclick=()=>book&&book.flipNext();document.getElementById('pageNo').onchange=goPage;
let pointerStart=null;
const shell=document.querySelector('.book-shell');
shell.addEventListener('pointerdown',e=>{if(e.target.tagName==='CANVAS')pointerStart={x:e.clientX,y:e.clientY,t:Date.now()}});
shell.addEventListener('pointerup',e=>{if(!pointerStart||!book||e.target.tagName!=='CANVAS'){pointerStart=null;return}const dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y,quick=Date.now()-pointerStart.t<450;if(quick&&Math.hypot(dx,dy)<12){const r=e.target.getBoundingClientRect();if(e.clientX<r.left+r.width/2)book.flipPrev();else book.flipNext()}pointerStart=null});
init();</script></body></html>
