<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 2 Digital Logic Simulator</title><style>
:root{--navy:#102f46;--blue:#167b91;--cyan:#35c6bd;--violet:#6b57b5;--gold:#f0b43c;--coral:#ef625f;--ink:#17333d;--line:#c7e1e1;--bg:#edf8f7;--green:#138568;--red:#bd4052}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff9e9,#edf8f7 48%,#edeafa)}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,var(--navy),var(--blue),var(--violet));color:#fff;border-bottom:4px solid var(--gold);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:9px;padding:8px 10px}.layout{display:grid;grid-template-columns:285px 1fr;min-height:100vh}aside{position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;padding:14px;background:#faffff;border-right:1px solid var(--line)}main{width:min(1120px,100%);padding:20px;margin:auto}.nav{width:100%;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:10px;margin:4px 0;text-align:left;font-weight:750;cursor:pointer}.nav.active{background:linear-gradient(100deg,var(--blue),var(--violet));color:#fff}.nav.done:after{content:' ✓';float:right;color:#26dfb1}.progress{height:12px;background:#dcebea;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--gold),var(--cyan));transition:.3s}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:0 12px 30px #173f5f16}.hero{padding:26px;background:linear-gradient(120deg,#fff,#efffff 60%,#fff3d3)}.hero h1{color:var(--navy);font-size:clamp(1.8rem,4vw,3rem);margin:.2em 0}.module{display:none}.module.active{display:block}.card{padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.tile{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fbffff}.tile h3{color:var(--blue);margin-top:0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer;background:linear-gradient(100deg,var(--blue),var(--violet));color:#fff}.btn.alt{background:#e7f3f4;color:var(--navy)}.btn.gold{background:linear-gradient(100deg,var(--gold),var(--coral));color:#182f38}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.readout{padding:10px 13px;border-radius:10px;background:var(--navy);color:#fff;font-family:Consolas,monospace;font-weight:800}.callout{border-left:6px solid var(--gold);padding:12px;background:#fff8df;border-radius:9px}.lab{border:2px dashed #83c7c8;background:#f6ffff;border-radius:15px;padding:16px}.signal{height:160px;width:100%;background:#102f46;border-radius:12px}.lamp{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:#cedada;border:6px solid #74888b;font-weight:900}.lamp.on{background:#ffe656;box-shadow:0 0 25px #f0b43c}.switch{min-width:82px}.switch.on{background:var(--gold);color:#17333d}.truth{width:100%;border-collapse:collapse;margin-top:12px}.truth th,.truth td{padding:9px;border:1px solid var(--line);text-align:center}.truth th{background:var(--navy);color:#fff}.truth tr.live{background:#ffefaa;font-weight:900}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.flow div{flex:1;min-width:125px;text-align:center;padding:14px;border-radius:12px;background:#e8f7f6;font-weight:800}.flow b{color:var(--violet)}.bits{display:flex;gap:6px;flex-wrap:wrap}.bit{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:900;transition:.3s}.bit.move{transform:translateY(-8px);background:var(--coral)}.question{padding:14px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.question label{display:block;padding:7px;cursor:pointer}.feedback{font-weight:800}.good{color:var(--green)}.bad{color:var(--red)}details{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}summary{padding:12px;background:#eaf8f8;font-weight:850;cursor:pointer}details>div{padding:13px}.formula{background:var(--navy);color:#fff;border-radius:10px;padding:12px;text-align:center;font-family:Consolas,monospace;font-size:1.15rem}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcf2f4;color:#176578;font-weight:800;margin:3px}.score{font-size:1.25rem;padding:15px;background:#e9f8f4;border-radius:12px;font-weight:900}@media(max-width:790px){.layout{display:block}aside{position:static;height:auto}.top{position:static;flex-direction:column;align-items:flex-start}.navlist{display:grid;grid-template-columns:1fr 1fr}.hero,.card{padding:16px}main{padding:11px}.flow div{min-width:100%}}
.bit{display:inline-grid;place-items:center;width:40px;height:40px;background:var(--navy);color:#fff;border-radius:8px;margin:4px;font-weight:900}.q{padding:12px;border:1px solid var(--line);border-radius:10px;margin:9px 0}.q label{display:block;padding:6px}.navlist{display:block}.score{padding:12px;border-radius:10px;background:#edf8f7;color:var(--navy)}</style></head><body><header class="top"><div class="brand">⚡ Lecture 2 Digital Logic Simulator</div><a href="index.html">Back to Learning Hub</a></header><div class="layout"><aside><h3>Lecture 2 Modules</h3><div class="progress"><i id="bar"></i></div><p><b id="pct">0%</b> complete</p><div class="navlist" id="nav"></div><button class="btn alt" onclick="resetAll()">Reset progress</button></aside><main><div id="app"></div></main></div><script>const mods=[["1. Inverter and Negation", "Inverter and Active-LOW Logic", "An inverter produces the complement of its input. A bubble on a logic symbol indicates inversion or active-LOW behavior.", "not"], ["2. Inverter Timing and 1's Complement", "Timing and Binary Complement", "Analyze every interval between input transitions. Applying NOT to every bit creates the 1's complement.", "invertbits"], ["3. AND Gate", "AND Logic", "AND is HIGH only when every input is HIGH. For n inputs, the truth table contains 2^n rows.", "and"], ["4. AND Enable Applications", "Enable and Interlock Control", "AND can enable a signal, count pulses during a measurement window, or require several safety conditions simultaneously.", "enable"], ["5. OR Gate", "OR Logic", "OR is HIGH when one or more inputs are HIGH. It combines multiple independent causes of one action.", "or"], ["6. NAND Gate", "NAND and Universality", "NAND is NOT-AND. It is LOW only for 11 and can implement NOT, AND, and OR.", "nand"], ["7. NOR Gate", "NOR and Universality", "NOR is NOT-OR. It is HIGH only for 00 and can also implement every basic Boolean function.", "nor"], ["8. DeMorgan and Bubble Logic", "Equivalent Gate Interpretations", "DeMorgan's theorems relate complemented products and sums and explain valid bubble movement.", "demorgan"], ["9. XOR Gate", "Exclusive-OR", "XOR is HIGH when two inputs are different. It supports modulo-2 addition and mismatch detection.", "xor"], ["10. XNOR Gate", "Exclusive-NOR", "XNOR is HIGH when two inputs are equal. It supports equality and agreement detection.", "xnor"], ["11. Half Adder and Failure Detection", "XOR Applications", "A half adder uses XOR for Sum and AND for Carry. XOR can detect disagreement between redundant outputs.", "half"], ["12. Lecture 2 Quiz", "Mastery Quiz", "Answer all questions and review any incorrect gate rules.", "quiz"]];const quiz=[["NOT of 0 is", ["0", "1"], 1], ["AND is HIGH for", ["00", "11", "01"], 1], ["OR is LOW for", ["00", "11", "10"], 0], ["NAND is LOW for", ["11", "00", "01"], 0], ["NOR is HIGH for", ["00", "11", "10"], 0], ["XOR is HIGH when inputs are", ["equal", "different"], 1], ["XNOR is HIGH when inputs are", ["equal", "different"], 0], ["Universal gates are", ["NAND and NOR", "XOR and XNOR"], 0], ["Half-adder sum uses", ["XOR", "NOR"], 0], ["Half-adder carry uses", ["AND", "OR"], 0]];let A=0,B=0,currentGate='NOT',current=0,done=JSON.parse(localStorage.getItem('L2simDone')||'[]');function calc(g,a,b){return {NOT:1-a,AND:a&b,OR:a|b,NAND:1-(a&b),NOR:1-(a|b),XOR:a^b,XNOR:1-(a^b)}[g]}function gateLab(g){currentGate=g;let two=g!=='NOT',y=calc(g,A,B),rows='';for(let i=0;i<(two?4:2);i++){let a=two?i>>1:i,b=two?i&1:0;rows+=`<tr class="${a===A&&(!two||b===B)?'live':''}"><td>${a}</td>${two?`<td>${b}</td>`:''}<td>${calc(g,a,b)}</td></tr>`}return `<div class="lab"><div class="controls"><button class="btn alt switch ${A?'on':''}" onclick="A=1-A;renderLab()">A = ${A}</button>${two?`<button class="btn alt switch ${B?'on':''}" onclick="B=1-B;renderLab()">B = ${B}</button>`:''}<div class="lamp ${y?'on':''}">X = ${y}</div></div><table><tr><th>A</th>${two?'<th>B</th>':''}<th>Output</th></tr>${rows}</table></div>`}function renderLab(){document.getElementById('interactive').innerHTML=gateLab(currentGate)}function moduleBody(m){let [t,h,e,type]=m;if(type==='quiz')return quizBody();let body=`<div class="hero"><span class="tag">Lecture 2</span><h1>${h}</h1><p>${e}</p></div><div class="card">`;if(['not','and','or','nand','nor','xor','xnor'].includes(type)){let g=type.toUpperCase();body+=`<div class="callout"><b>Boolean operation:</b> ${g==='NOT'?'X = not A':`X = A ${g.toLowerCase()} B`}</div><div id="interactive">${gateLab(g)}</div>`}else if(type==='invertbits'){body+=`<div class="lab"><label>8-bit value: <input id="bits" value="10110010" maxlength="8" oninput="invertBits()"></label><p id="bitOut"></p></div>`}else if(type==='enable'){body+=`<div class="lab"><div class="controls"><button class="btn alt" onclick="A=1-A;enableDemo()">DATA = <span id="ed">0</span></button><button class="btn alt" onclick="B=1-B;enableDemo()">ENABLE = <span id="ee">0</span></button><div id="el" class="lamp">OUT=0</div></div></div>`}else if(type==='demorgan'){body+=`<div class="grid"><div class="callout"><b>(A·B)̅ = A̅ + B̅</b><p>A NAND function equals OR with both inputs complemented.</p></div><div class="callout"><b>(A+B)̅ = A̅·B̅</b><p>A NOR function equals AND with both inputs complemented.</p></div></div><div id="interactive">${gateLab('NAND')}</div>`}else if(type==='half'){body+=`<div class="lab controls"><button class="btn alt" onclick="A=1-A;halfDemo()">A=<span id="ha">0</span></button><button class="btn alt" onclick="B=1-B;halfDemo()">B=<span id="hb">0</span></button><div class="lamp" id="hs">SUM=0</div><div class="lamp" id="hc">CARRY=0</div></div>`}body+=`<div class="callout"><b>Learning check:</b> Change every input combination and explain why the output changes.</div><div class="controls"><button class="btn alt" onclick="show(Math.max(0,current-1))">Previous</button><button class="btn gold" onclick="complete(current)">Mark complete</button><button class="btn" onclick="show(Math.min(mods.length-1,current+1))">Next</button></div></div>`;return body}function show(i){current=i;document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.getElementById('n'+i).classList.add('active');document.getElementById('app').innerHTML=moduleBody(mods[i]);let type=mods[i][3];if(type==='invertbits')invertBits();if(type==='enable')enableDemo();if(type==='half')halfDemo();progress();window.scrollTo({top:0,behavior:'smooth'})}function complete(i){if(!done.includes(i)){done.push(i);localStorage.setItem('L2simDone',JSON.stringify(done))}progress();show(Math.min(mods.length-1,i+1))}function progress(){let p=Math.round(done.length/mods.length*100);let bar=document.getElementById('bar'),pct=document.getElementById('pct');if(bar)bar.style.width=p+'%';if(pct)pct.textContent=p+'%';mods.forEach((_,i)=>{let n=document.getElementById('n'+i);if(n)n.classList.toggle('done',done.includes(i))})}function resetAll(){localStorage.removeItem('L2simDone');location.reload()}function invertBits(){let v=(document.getElementById('bits').value||'').replace(/[^01]/g,'').slice(0,8);document.getElementById('bits').value=v;document.getElementById('bitOut').innerHTML=`Original: ${[...v].map(x=>`<span class="bit">${x}</span>`).join('')}<br>1's complement: ${[...v].map(x=>`<span class="bit">${1-+x}</span>`).join('')}`}function enableDemo(){let y=A&B;document.getElementById('ed').textContent=A;document.getElementById('ee').textContent=B;let l=document.getElementById('el');l.textContent='OUT='+y;l.classList.toggle('on',y)}function halfDemo(){document.getElementById('ha').textContent=A;document.getElementById('hb').textContent=B;let s=A^B,c=A&B,ls=document.getElementById('hs'),lc=document.getElementById('hc');ls.textContent='SUM='+s;lc.textContent='CARRY='+c;ls.classList.toggle('on',s);lc.classList.toggle('on',c)}function quizBody(){return `<div class="hero"><span class="tag">Lecture 2</span><h1>Lecture 2 Mastery Quiz</h1></div><div class="card"><p>Answer all ${quiz.length} questions.</p><div id="quiz">${quiz.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}<div id="f${i}"></div></div>`).join('')}</div><button class="btn" onclick="grade()">Submit quiz</button><h2 id="score"></h2></div>`}function grade(){let score=0;quiz.forEach((q,i)=>{let p=document.querySelector(`input[name=q${i}]:checked`),f=document.getElementById('f'+i);if(!p){f.textContent='Please answer.';return}let ok=+p.value===q[2];if(ok)score++;f.textContent=ok?'✓ Correct':'✗ Correct answer: '+q[1][q[2]];f.style.color=ok?'#138568':'#bd4052'});document.getElementById('score').textContent=`Score: ${score}/${quiz.length} (${Math.round(score/quiz.length*100)}%)`}document.getElementById('nav').innerHTML=mods.map((m,i)=>`<button class="nav" id="n${i}" onclick="show(${i})">${m[0]}</button>`).join('');show(0);progress();</script></body></html>
