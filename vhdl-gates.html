<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VHDL Gate Code Library</title><style>:root{--n:#113a55;--b:#197f93;--v:#6955b2;--g:#f0b43d;--line:#c7dfdf}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#fff8e7,#edf9f7,#efecfb);color:#17343d}header{padding:15px 20px;background:linear-gradient(100deg,var(--n),var(--b),var(--v));color:white;border-bottom:4px solid var(--g);display:flex;justify-content:space-between;align-items:center}header a{color:white;text-decoration:none;border:1px solid #ffffff66;border-radius:9px;padding:8px 12px}main{max-width:1150px;margin:auto;padding:20px}.hero,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 28px #123b5615}.card{margin-top:14px}.grid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px}.nav{display:grid;gap:7px;align-content:start}button{font:inherit;border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.gate{background:white;border:1px solid var(--line);color:var(--n);text-align:left}.gate.active,.primary{background:linear-gradient(100deg,var(--b),var(--v));color:white}.alt{background:#e7f3f4;color:var(--n)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}pre{margin:0;background:#102f46;color:#e9ffff;padding:18px;border-radius:14px;overflow:auto;min-height:420px;font:15px/1.55 Consolas,Monaco,monospace}.note{border-left:6px solid var(--g);background:#fff7dd;padding:12px;border-radius:9px}@media(max-width:700px){.grid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><b>💻 VHDL Gate Code Library</b><a href="index.html">Back to Learning Hub</a></header><main><section class="hero"><h1>Code for all basic logic gates</h1><p>Select a gate to view, copy, or download its VHDL implementation.</p><div class="note">These are newly written educational implementations based on standard VHDL gate behavior.</div></section><section class="card"><div class="actions"><button class="primary" onclick="copyCode()">Copy selected code</button><button class="alt" onclick="downloadOne()">Download selected .vhd</button><button class="alt" onclick="downloadAll()">Download all gates</button></div><div class="grid"><div class="nav" id="nav"></div><pre id="code"></pre></div></section></main><script>const gates={"NOT": {"file": "not_gate.vhd", "code": "library IEEE;\nuse IEEE.STD_LOGIC_1164.ALL;\n\nentity not_gate is\n  port (A : in STD_LOGIC; X : out STD_LOGIC);\nend not_gate;\n\narchitecture Behavioral of not_gate is\nbegin\n  X <= not A;\nend Behavioral;"}, "AND": {"file": "and_gate.vhd", "code": "library IEEE;\nuse IEEE.STD_LOGIC_1164.ALL;\n\nentity and_gate is\n  port (A, B : in STD_LOGIC; X : out STD_LOGIC);\nend and_gate;\n\narchitecture Behavioral of and_gate is\nbegin\n  X <= A and B;\nend Behavioral;"}, "OR": {"file": "or_gate.vhd", "code": "library IEEE;\nuse IEEE.STD_LOGIC_1164.ALL;\n\nentity or_gate is\n  port (A, B : in STD_LOGIC; X : out STD_LOGIC);\nend or_gate;\n\narchitecture Behavioral of or_gate is\nbegin\n  X <= A or B;\nend Behavioral;"}, "NAND": {"file": "nand_gate.vhd", "code": "library IEEE;\nuse IEEE.STD_LOGIC_1164.ALL;\n\nentity nand_gate is\n  port (A, B : in STD_LOGIC; X : out STD_LOGIC);\nend nand_gate;\n\narchitecture Behavioral of nand_gate is\nbegin\n  X <= A nand B;\nend Behavioral;"}, "NOR": {"file": "nor_gate.vhd", "code": "library IEEE;\nuse IEEE.STD_LOGIC_1164.ALL;\n\nentity nor_gate is\n  port (A, B : in STD_LOGIC; X : out STD_LOGIC);\nend nor_gate;\n\narchitecture Behavioral of nor_gate is\nbegin\n  X <= A nor B;\nend Behavioral;"}, "XOR": {"file": "xor_gate.vhd", "code": "library IEEE;\nuse IEEE.STD_LOGIC_1164.ALL;\n\nentity xor_gate is\n  port (A, B : in STD_LOGIC; X : out STD_LOGIC);\nend xor_gate;\n\narchitecture Behavioral of xor_gate is\nbegin\n  X <= A xor B;\nend Behavioral;"}, "XNOR": {"file": "xnor_gate.vhd", "code": "library IEEE;\nuse IEEE.STD_LOGIC_1164.ALL;\n\nentity xnor_gate is\n  port (A, B : in STD_LOGIC; X : out STD_LOGIC);\nend xnor_gate;\n\narchitecture Behavioral of xnor_gate is\nbegin\n  X <= A xnor B;\nend Behavioral;"}};let selected='NOT';function show(g){selected=g;document.getElementById('code').textContent=gates[g].code;document.querySelectorAll('.gate').forEach(b=>b.classList.toggle('active',b.dataset.g===g))}function init(){document.getElementById('nav').innerHTML=Object.keys(gates).map(g=>`<button class="gate" data-g="${g}" onclick="show('${g}')">${g} gate</button>`).join('');show('NOT')}function save(name,text){let b=new Blob([text],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function copyCode(){navigator.clipboard.writeText(gates[selected].code).then(()=>alert(selected+' code copied')).catch(()=>alert('Select the code and copy manually.'))}function downloadOne(){save(gates[selected].file,gates[selected].code)}function downloadAll(){save('all_basic_gates.vhd',Object.entries(gates).map(([n,g])=>'-- '+n+' GATE
'+g.code).join('

'))}init();</script></body></html>
