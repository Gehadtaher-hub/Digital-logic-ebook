d questions, challenging scenarios, and configurable examinations.</p><div class="grid"><div class="metric"><strong>${all().length}</strong><br>total questions</div><div class="metric"><strong>${all().filter(x=>['challenge','scenario'].includes(x.q.difficulty)).length}</strong><br>challenge questions</div><div class="metric"><strong>${Object.keys(state).length}</strong><br>practiced answers</div><div class="metric"><strong>${history.length}</strong><br>completed tests</div></div></section>`}function practice(ci=0){let c=chapters[ci];app.innerHTML=`<section class="card"><span class="tag">Practice with feedback</span><h2>${c.title}</h2><select onchange="practice(+this.value)">${chapters.map((x,i)=>`<option value="${i}" ${i==ci?'selected':''}>Chapter ${i+1}: ${x.title}</option>`).join('')}</select>${c.questions.map((q,i)=>card(ci,i,q)).join('')}</section>`}function card(ci,qi,q){let s=state[ci+'_'+qi];return`<div class="question"><b>${qi+1}. ${q.q}</b><small> • ${q.difficulty}</small>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="p${ci}_${qi}" ${s&&s.sel===j?'checked':''} onchange="answer(${ci},${qi},${j})"> ${o}</label>`).join('')}<div id="f${ci}_${qi}">${s?(s.ok?'<span class="good">Correct. </span>':'<span class="bad">Incorrect. </span>')+q.e:''}</div></div>`}function answer(ci,qi,sel){let q=chapters[ci].questions[qi];state[ci+'_'+qi]={sel,ok:sel===q.a};save();document.getElementById('f'+ci+'_'+qi).innerHTML=(sel===q.a?'<span class="good">Correct. </span>':'<span class="bad">Incorrect. </span>')+q.e}function challenge(){start('Challenge',sh(all().filter(x=>['challenge','scenario'].includes(x.q.difficulty))).slice(0,25),1200,70)}function examSetup(){app.innerHTML=`<section class="card"><h2>Configure examination</h2><div class="grid"><label>Questions<select id="cnt"><option>20</option><option selected>40</option><option>60</option><option>90</option><option>108</option></select></label><label>Minutes<input id="mins" type="number" value="50"></label><label>Passing grade<input id="pass" type="number" value="60"></label><label>Question type<select id="type"><option value="all">All levels</option><option value="easy">Direct</option><option value="medium">Applied</option><option value="challenge">Challenge</option><option value="scenario">Scenario</option></select></label></div><p><button class="btn primary" onclick="makeExam()">Start examination</button></p></section>`}function makeExam(){let p=all().filter(x=>type.value==='all'||x.q.difficulty===type.value);start('Examination',sh(p).slice(0,Math.min(+cnt.value,p.length)),+mins.value*60,+pass.value)}function start(title,items,seconds,pass){run={title,items:items.map(x=>({...x,order:sh([0,1,2,3])})),seconds,pass,answers:{},flags:{},idx:0,start:Date.now()};render();tick=setInterval(()=>{run.seconds--;if(window.timer)timer.textContent=fmt(run.seconds);if(run.seconds<=0)submit()},1000)}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function render(){let x=run.items[run.idx],sel=run.answers[run.idx];app.innerHTML=`<section class="card"><div class="row"><span class="tag">${run.title}</span><span class="timer" id="timer">${fmt(run.seconds)}</span></div><div class="navigator">${run.items.map((_,i)=>`<button class="${i===run.idx?'cur ':''}${run.answers[i]!==undefined?'ans ':''}${run.flags[i]?'flag':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><div class="progress"><div style="width:${Object.keys(run.answers).length/run.items.length*100}%"></div></div><div class="question"><small>Chapter ${x.ci+1} • ${x.q.difficulty}</small><h2>${run.idx+1}. ${x.q.q}</h2>${x.order.map(j=>`<label class="option"><input type="radio" name="r" ${sel===j?'checked':''} onchange="run.answers[run.idx]=${j};render()"> ${x.q.o[j]}</label>`).join('')}</div><div class="row"><button class="btn secondary" onclick="jump(${Math.max(0,run.idx-1)})">Previous</button><button class="btn secondary" onclick="run.flags[run.idx]=!run.flags[run.idx];render()">Flag</button><button class="btn primary" onclick="jump(${Math.min(run.items.length-1,run.idx+1)})">Next</button><button class="btn secondary" onclick="submit()">Submit</button></div></section>`}function jump(i){run.idx=i;render()}function submit(){clearInterval(tick);let score=run.items.filter((x,i)=>run.answers[i]===x.q.a).length,r={title:run.title,score,total:run.items.length,pct:Math.round(score/run.items.length*100),pass:run.pass,date:new Date().toISOString()};history.unshift(r);save();report(r)}function report(r){app.innerHTML=`<section class="card"><h2>${r.title} report</h2><div class="metric"><strong>${r.score}/${r.total} (${r.pct}%)</strong></div><p class="${r.pct>=r.pass?'good':'bad'}">${r.pct>=r.pass?'Passed':'Not passed'}</p></section>`}function mockExam(){let p=sh(all()),picked=[];chapters.forEach((c,ci)=>{let pool=sh(p.filter(x=>x.ci===ci));picked.push(...pool.slice(0,10))});start('Mock Final Examination',sh(picked),5400,60)}
function simulator(){app.innerHTML=`<section class="card"><span class="tag">Interactive logic laboratory</span><h2>Logic Gate Simulator</h2><p>Select a gate and toggle inputs A and B. The output and truth-table result update immediately.</p><div class="grid"><label>Gate<select id="gate" onchange="simUpdate()"><option>AND</option><option>OR</option><option>NOT</option><option>NAND</option><option>NOR</option><option>XOR</option><option>XNOR</option></select></label><div class="term"><b>Input A</b><p><button class="btn secondary" id="aBtn" onclick="simA^=1;simUpdate()">0</button></p></div><div class="term"><b>Input B</b><p><button class="btn secondary" id="bBtn" onclick="simB^=1;simUpdate()">0</button></p></div><div class="metric"><strong id="simOut">0</strong><br>Output Q</div></div><div id="gateDiagram" class="question" style="text-align:center;font-size:24px;margin-top:16px"></div><h3>Live truth explanation</h3><p id="simExplain"></p><h3>Mini circuit: Half Adder</h3><div class="grid"><div class="metric"><strong id="sumOut">0</strong><br>SUM = A XOR B</div><div class="metric"><strong id="carryOut">0</strong><br>CARRY = A AND B</div></div></section>`;simA=0;simB=0;simUpdate()}
let simA=0,simB=0;function simUpdate(){if(!document.getElementById('gate'))return;let g=gate.value,q=0;if(g==='AND')q=simA&simB;if(g==='OR')q=simA|simB;if(g==='NOT')q=simA?0:1;if(g==='NAND')q=(simA&simB)?0:1;if(g==='NOR')q=(simA|simB)?0:1;if(g==='XOR')q=simA^simB;if(g==='XNOR')q=(simA^simB)?0:1;aBtn.textContent=simA;bBtn.textContent=simB;bBtn.disabled=g==='NOT';simOut.textContent=q;sumOut.textContent=simA^simB;carryOut.textContent=simA&simB;gateDiagram.textContent=`A=${simA}  ${g}  ${g==='NOT'?'':`B=${simB}`}  →  Q=${q}`;simExplain.textContent=g==='NOT'?`NOT complements A, so NOT ${simA} = ${q}.`:`For ${g}, inputs A=${simA} and B=${simB} produce Q=${q}.`}
function mastery(){app.innerHTML=`<section class="card"><h2>Chapter mastery</h2><table><tr><th>Chapter</th><th>Attempted</th><th>Accuracy</th></tr>${chapters.map((c,i)=>{let k=Object.keys(state).filter(x=>x.startsWith(i+'_')),ok=k.filter(x=>state[x].ok).length;return`<tr><td>${c.title}</td><td>${k.length}/${c.questions.length}</td><td>${k.length?Math.round(ok/k.length*100):0}%</td></tr>`}).join('')}</table></section>`}function glossary(){app.innerHTML=`<section class="card"><h2>Glossary</h2><div class="grid">${glossaryData.map(x=>`<div class="term"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div></section>`}function reports(){app.innerHTML=`<section class="card"><h2>Assessment reports</h2>${history.length?history.map(r=>`<p>${new Date(r.date).toLocaleString()} • ${r.title} • <b>${r.pct}%</b></p>`).join(''):'<p>No reports yet.</p>'}</section>`}home();</script></body></html>
