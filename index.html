<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foundations of Digital Circuits</title><style>:root{--navy:#12395a;--blue:#1976a8;--cyan:#2aaac7;--green:#2d8f69;--paper:#fff;--bg:#eef7fa;--line:#bcd9e3;--text:#18313f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#f8fcfd,#e5f2f5);color:var(--text)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background-image:linear-gradient(90deg,transparent 49%,#199ec733 50%,transparent 51%),linear-gradient(transparent 49%,#199ec733 50%,transparent 51%);background-size:64px 64px}header{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,#12395a,#1d6685);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:4px solid #55c8c4;box-shadow:0 4px 16px #12395a44}h1{margin:0;font-size:clamp(20px,3vw,30px)}.sub{color:#c8f2f5;font-size:13px}.btn,.toolbar button,.toolbar input{border:1px solid #78b8ca;border-radius:10px;padding:9px 13px;background:#fff;color:#12395a;font-weight:750}.btn{text-decoration:none}.wrap{padding:14px;display:flex;flex-direction:column;align-items:center}.toolbar{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;background:#fffffff0;border:1px solid var(--line);border-radius:14px;padding:9px 14px;margin-bottom:12px;box-shadow:0 5px 16px #18466322}.toolbar input{width:70px}.book-shell{width:min(1240px,97vw);height:calc(100vh - 170px);min-height:300px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}.flip-book{display:none;filter:drop-shadow(0 18px 22px #19384b55)}.page{background:#fff;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #9dcbd7}.page canvas{width:100%;height:100%;object-fit:contain;background:#fff}.link-layer{position:absolute;inset:0;pointer-events:none}.pdf-link{position:absolute;pointer-events:auto;background:transparent;border:0;cursor:pointer}.pdf-link:hover{background:#4fc3d633;outline:2px solid #1aa1be}.loading{padding:32px;background:#fff;border:1px solid var(--line);border-radius:17px;text-align:center}.watermark{position:absolute;bottom:9px;left:0;right:0;text-align:center;color:#1976a833;font-size:12px;font-weight:bold;pointer-events:none}@media(max-width:700px){header{flex-direction:column;align-items:flex-start}.book-shell{height:calc(100vh - 225px)}.hint{display:none}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script></head><body><header><div><h1>Foundations of Digital Circuits</h1><div class="sub">Light electronics edition • clickable contents</div></div><a class="btn" href="studio.html">Interactive Activities</a></header><main class="wrap"><div class="toolbar"><button id="prev">Previous</button><span id="status">Preparing...</span><span class="hint">Contents and document links are clickable</span><button id="next">Next</button><label>Page <input id="pageNo" type="number" min="1" value="1"></label></div><div class="book-shell"><div id="loading" class="loading"><h2>Loading digital flipbook</h2><p>Preparing pages and links...</p></div><div id="book" class="flip-book"></div></div></main><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let book,total=0,pdfDoc;async function destPage(dest){try{const d=typeof dest==='string'?await pdfDoc.getDestination(dest):dest;if(!d)return null;return typeof d[0]==='object'?(await pdfDoc.getPageIndex(d[0]))+1:Number.isInteger(d[0])?d[0]+1:null}catch(e){return null}}async function links(pg,d,v){const as=await pg.getAnnotations({intent:'display'}),l=document.createElement('div');l.className='link-layer';for(const a of as){if(a.subtype!=='Link'||!a.rect)continue;let r=v.convertToViewportRectangle(a.rect),x=Math.min(r[0],r[2]),y=Math.min(r[1],r[3]),w=Math.abs(r[2]-r[0]),h=Math.abs(r[3]-r[1]),e=document.createElement('a');e.className='pdf-link';e.href='#';e.style.cssText=`left:${x/v.width*100}%;top:${y/v.height*100}%;width:${w/v.width*100}%;height:${h/v.height*100}%`;e.onclick=async ev=>{ev.preventDefault();ev.stopPropagation();if(a.url)window.open(a.url,'_blank','noopener');else{let p=await destPage(a.dest);if(p)book.flip(p-1)}};l.appendChild(e)}d.appendChild(l)}async function init(){try{pdfDoc=await pdfjsLib.getDocument('digital_ebook.pdf').promise;total=pdfDoc.numPages;for(let n=1;n<=total;n++){status.textContent=`Preparing ${n}/${total}`;let p=await pdfDoc.getPage(n),v=p.getViewport({scale:1.25}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;let d=document.createElement('div');d.className='page';if(n===1)d.dataset.density='hard';d.appendChild(c);await links(p,d,v);let w=document.createElement('div');w.className='watermark';w.textContent='FOUNDATIONS OF DIGITAL CIRCUITS';d.appendChild(w);bookEl.appendChild(d)}loading.style.display='none';bookEl.style.display='block';book=new St.PageFlip(bookEl,{width:550,height:730,size:'stretch',minWidth:220,maxWidth:650,minHeight:280,maxHeight:760,showCover:true,mobileScrollSupport:false,usePortrait:true,drawShadow:true,flippingTime:700});book.loadFromHTML(document.querySelectorAll('.page'));book.on('flip',e=>{status.textContent=`Page ${e.data+1} of ${total}`;pageNo.value=e.data+1});status.textContent=`Page 1 of ${total}`}catch(e){loading.innerHTML='<h2>Unable to load ebook</h2><p>Confirm digital_ebook.pdf is in the same folder.</p>'}}const bookEl=document.getElementById('book');prev.onclick=()=>book&&book.flipPrev();next.onclick=()=>book&&book.flipNext();pageNo.onchange=()=>book&&book.flip(Math.max(1,Math.min(total,+pageNo.value||1))-1);init();</script></body></html>
