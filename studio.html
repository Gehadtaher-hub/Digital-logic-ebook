<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Circuits Activity Studio</title><style>:root{--bg:#030912;--card:#081b2b;--cyan:#22d3ee;--blue:#1687c8;--green:#39ff9a;--text:#edfeff;--muted:#9ac0d2;--line:#1e536b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#143e58,#061522 45%,#02070d);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:#04111def;border-bottom:1px solid var(--cyan);box-shadow:0 5px 22px #000b}.back,.btn{display:inline-block;border:1px solid #2784a3;border-radius:9px;padding:10px 13px;background:#0b2a3e;color:#fff;text-decoration:none;font-weight:750;cursor:pointer}.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}aside{padding:14px;background:#061522;border-right:1px solid var(--line)}.nav{display:block;width:100%;margin:7px 0;padding:11px;border:1px solid transparent;border-radius:9px;background:#0a2435;color:#dffdff;text-align:left;font-weight:700;cursor:pointer}.nav.active,.nav:hover{border-color:var(--cyan);background:#0b3449;box-shadow:0 0 14px #22d3ee33}main{width:100%;max-width:1050px;margin:auto;padding:22px}.card{background:linear-gradient(145deg,#0a2233,#071724);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 14px 30px #0007}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.metric,.question,.term{padding:16px;border:1px solid var(--line);border-radius:13px;background:#06131f}.metric b{display:block;color:var(--cyan);font-size:32px}.tag{display:inline-block;padding:5px 9px;border:1px solid #1686a5;border-radius:999px;color:#82efff;background:#073547}.option{display:block;padding:10px;margin:8px 0;border:1px solid var(--line);border-radius:9px;background:#0a2131}.good{color:var(--green)}.bad{color:#ff8b8b}select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#06131f;color:#fff}@media(max-width:760px){.layout{display:block}aside{display:flex;overflow:auto}.nav{min-width:140px}main{padding:10px}header h1{font-size:19px}}</style></head><body><header><h1>Digital Circuits Activity Studio</h1><a class="back" href="index.html">Back to eBook</a></header><div class="layout"><aside><button class="nav active" onclick="show('home',this)">Dashboard</button><button class="nav" onclick="show('practice',this)">Practice</button><button class="nav" onclick="show('glossary',this)">Glossary</button></aside><main><div id="app"></div></main></div><script>
const qs=[['A digital signal normally uses which values?',['Continuous values','Discrete logic levels','Only negative values'],1,'Digital systems use discrete logic levels.'],['What does an AND gate output when both inputs are 1?',['0','1','Undefined'],1,'AND is 1 only when all inputs are 1.'],['A nibble contains how many bits?',['2','4','8'],1,'A nibble contains four bits.'],['Which gates are universal?',['AND and OR','NAND and NOR','XOR and XNOR'],1,'NAND and NOR can each implement any Boolean function.'],['A flip-flop stores how many bits?',['1','4','8'],0,'A flip-flop stores one bit.'],['A 4-to-1 multiplexer needs how many select lines?',['1','2','4'],1,'Two bits select among four inputs.']];const terms=[['ADC','Analog-to-digital converter.'],['DAC','Digital-to-analog converter.'],['K-map','Visual Boolean simplification method.'],['Multiplexer','Selects one of several data inputs.'],['Flip-flop','Clocked one-bit storage element.'],['Register','Collection of flip-flops storing a word.']];function nav(b){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}function show(n,b){nav(b);if(n==='home')home();if(n==='practice')practice();if(n==='glossary')glossary()}function home(){app.innerHTML='<section class="card"><span class="tag">DIGITAL LAB</span><h2>Foundations of Digital Circuits</h2><p>Use the clickable flipbook for reading and this studio for quick concept checks.</p><div class="grid"><div class="metric"><b>6</b>practice questions</div><div class="metric"><b>6</b>key terms</div><div class="metric"><b>100%</b>browser based</div></div></section>'}function practice(){app.innerHTML='<section class="card"><h2>Quick practice</h2>'+qs.map((q,i)=>'<div class="question"><b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map((x,j)=>'<label class="option"><input type="radio" name="q'+i+'" onchange="check('+i+','+j+')"> '+x+'</label>').join('')+'<div id="f'+i+'"></div></div>').join('')+'</section>'}function check(i,j){document.getElementById('f'+i).innerHTML=(j===qs[i][2]?'<span class="good">Correct. </span>':'<span class="bad">Try again. </span>')+qs[i][3]}function glossary(){app.innerHTML='<section class="card"><h2>Glossary</h2><div class="grid">'+terms.map(x=>'<div class="term"><b>'+x[0]+'</b><p>'+x[1]+'</p></div>').join('')+'</div></section>'}home();</script></body></html>
