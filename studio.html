<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foundations of Digital Circuits Activities</title><style>:root{--card:#fffaf0;--ink:#263238;--blue:#7a263a;--line:#d8c8a4;--good:#2c6e49;--bad:#a23a3a}*{box-sizing:border-box}body{margin:0;background:#eee5d3;color:var(--ink);font-family:Georgia,serif}header{background:#18324a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:5px solid #c59b45}.layout{display:grid;grid-template-columns:270px 1fr;min-height:100vh}aside{background:#fffaf0;padding:14px}main{max-width:1050px;width:100%;padding:22px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:25px;margin-bottom:18px}.nav,.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:750;cursor:pointer}.nav{display:block;width:100%;margin:6px 0;text-align:left;background:#f3e8cf}.nav.active,.primary{background:var(--blue);color:#fff}.secondary{background:#fffaf0;color:#18324a;border:1px solid #b99c5e}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.metric,.question,.term{background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:15px}.metric strong,.big{font-size:34px;color:var(--blue)}.option{display:block;border:1px solid var(--line);border-radius:11px;padding:11px;margin:8px 0}.good{color:var(--good)}.bad{color:var(--bad)}select,input{width:100%;padding:10px}.tag{background:#f1dfb5;padding:6px 9px;border-radius:20px}.navigator{display:flex;gap:5px;flex-wrap:wrap}.navigator button{width:38px;height:38px}.cur{border:3px solid var(--blue)}.ans{background:#dff7ea}.flag{outline:3px solid orange}.progress{height:10px;background:#ddd}.progress div{height:100%;background:var(--blue)}.timer{font-size:24px;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid var(--line)}@media(max-width:760px){.layout{display:block}aside{display:flex;overflow:auto}.nav{min-width:130px}main{padding:10px}}</style></head><body><header><h1>Foundations of Digital Circuits Ebook Activities</h1><div class="row"><a class="btn secondary" href="index.html">Back to eBook</a><span id="who">Guest</span></div></header><div class="layout"><aside><button class="nav active" onclick="go('home',this)">Dashboard</button><button class="nav" onclick="go('study',this)">Practice</button><button class="nav" onclick="go('challenge',this)">Challenge</button><button class="nav" onclick="go('exam',this)">Examination</button><button class="nav" onclick="go('mastery',this)">Mastery</button><button class="nav" onclick="go('glossary',this)">Glossary</button><button class="nav" onclick="go('results',this)">Reports</button><button class="nav" onclick="go('profile',this)">Profile</button></aside><main><div id="app"></div></main></div><script>const chapters=[{"title":"Introduction to Digital Systems","summary":"Digital hierarchy, analog and digital signals, ADC/DAC, waveforms, timing, and number-system basics","questions":[{"q":"Digital systems typically process which type of data?","o":["Continuous only","Discrete binary data","Mechanical data only","No signals"],"a":1,"e":"Digital systems process discrete values, commonly 0 and 1.","difficulty":"easy","id":"C1Q1"},{"q":"An analog signal is best described as what?","o":["Continuous over a range","Only 0 or 1","Always periodic","Always digital"],"a":0,"e":"Analog signals vary continuously.","difficulty":"medium","id":"C1Q2"},{"q":"Which ADC stage takes measurements at regular intervals?","o":["Encoding","Sampling","Storage","Inversion"],"a":1,"e":"Sampling measures the analog signal at discrete times.","difficulty":"hard","id":"C1Q3"},{"q":"A 3-bit ADC provides how many levels?","o":["3","6","8","16"],"a":2,"e":"An n-bit converter has 2^n levels.","difficulty":"easy","id":"C1Q4"},{"q":"Frequency and period are related by which equation?","o":["f=T","f=1/T","f=T^2","f=2T"],"a":1,"e":"Frequency is the reciprocal of period.","difficulty":"medium","id":"C1Q5"},{"q":"A rising edge changes from what to what?","o":["HIGH to LOW","LOW to HIGH","1 to 1","Analog to digital"],"a":1,"e":"A rising edge is a LOW-to-HIGH transition.","difficulty":"hard","id":"C1Q6"},{"q":"Duty cycle equals which ratio?","o":["Period/pulse width","Pulse width/period","Frequency/voltage","Bits/second"],"a":1,"e":"Duty cycle is pulse width divided by period, usually as a percentage.","difficulty":"easy","id":"C1Q7"},{"q":"A nibble contains how many bits?","o":["2","4","8","16"],"a":1,"e":"A nibble is four bits.","difficulty":"medium","id":"C1Q8"},{"q":"One hexadecimal digit corresponds to how many binary bits?","o":["2","3","4","8"],"a":2,"e":"A hexadecimal digit maps to four bits.","difficulty":"hard","id":"C1Q9"},{"q":"Which component converts digital data to an analog output?","o":["ADC","DAC","Register","Decoder"],"a":1,"e":"A DAC performs digital-to-analog conversion.","difficulty":"easy","id":"C1Q10"}]},{"title":"Number Systems and Arithmetic","summary":"Conversions, complements, signed numbers, binary arithmetic, codes, parity, and registers","questions":[{"q":"What is decimal 13 in binary?","o":["1011","1101","1110","1001"],"a":1,"e":"13 = 8+4+1, so it is 1101.","difficulty":"easy","id":"C2Q1"},{"q":"Binary 1011 equals which decimal value?","o":["9","10","11","13"],"a":2,"e":"1011 equals 8+2+1 = 11.","difficulty":"medium","id":"C2Q2"},{"q":"Hexadecimal A represents decimal what?","o":["8","9","10","11"],"a":2,"e":"Hexadecimal A has value 10.","difficulty":"hard","id":"C2Q3"},{"q":"The 1s complement of 1010 is what?","o":["0101","0110","1011","1101"],"a":0,"e":"Invert every bit to obtain 0101.","difficulty":"easy","id":"C2Q4"},{"q":"The 2s complement is obtained by doing what?","o":["Add 1 to the 1s complement","Remove the MSB","Shift right","Add 2 to the original"],"a":0,"e":"Two\u2019s complement is one\u2019s complement plus one.","difficulty":"medium","id":"C2Q5"},{"q":"What is 101 + 011 in binary?","o":["1000","111","1010","1100"],"a":0,"e":"5 + 3 = 8, represented as 1000.","difficulty":"hard","id":"C2Q6"},{"q":"BCD represents each decimal digit using how many bits?","o":["2","3","4","8"],"a":2,"e":"Each decimal digit is encoded separately in four bits.","difficulty":"easy","id":"C2Q7"},{"q":"In Gray code, consecutive values differ by how many bits?","o":["One","Two","Three","Four"],"a":0,"e":"Gray code changes one bit between adjacent values.","difficulty":"medium","id":"C2Q8"},{"q":"An even parity bit makes the total number of 1s what?","o":["Odd","Even","Zero","Prime"],"a":1,"e":"Even parity produces an even total count of ones.","difficulty":"hard","id":"C2Q9"},{"q":"A 16-bit register uses how many one-bit storage elements?","o":["4","8","16","32"],"a":2,"e":"A register needs one flip-flop per stored bit.","difficulty":"easy","id":"C2Q10"}]},{"title":"Logic Gates","summary":"NOT, AND, OR, XOR, NAND, NOR, XNOR, truth tables, and universal gates","questions":[{"q":"A NOT gate output for input 1 is what?","o":["0","1","Undefined","2"],"a":0,"e":"NOT complements its input.","difficulty":"easy","id":"C3Q1"},{"q":"An AND gate outputs 1 when what condition holds?","o":["Any input is 1","All inputs are 1","Inputs differ","All inputs are 0"],"a":1,"e":"AND requires every input to be 1.","difficulty":"medium","id":"C3Q2"},{"q":"An OR gate outputs 0 when what condition holds?","o":["All inputs are 0","Any input is 1","Inputs differ","All inputs are 1"],"a":0,"e":"OR is zero only when all inputs are zero.","difficulty":"hard","id":"C3Q3"},{"q":"XOR outputs 1 for which input relationship?","o":["Inputs are equal","Inputs are different","Both are 0 only","Both are 1 only"],"a":1,"e":"XOR detects inequality for two inputs.","difficulty":"easy","id":"C3Q4"},{"q":"XNOR outputs 1 when inputs are what?","o":["Different","Equal","Both high only","Floating"],"a":1,"e":"XNOR detects equality.","difficulty":"medium","id":"C3Q5"},{"q":"NAND is the complement of which gate?","o":["OR","AND","XOR","NOT"],"a":1,"e":"NAND is NOT-AND.","difficulty":"hard","id":"C3Q6"},{"q":"NOR is the complement of which gate?","o":["OR","AND","XOR","XNOR"],"a":0,"e":"NOR is NOT-OR.","difficulty":"easy","id":"C3Q7"},{"q":"Which pair are universal gates?","o":["AND and OR","NAND and NOR","XOR and XNOR","NOT and XOR"],"a":1,"e":"Any Boolean function can be built using only NANDs or only NORs.","difficulty":"medium","id":"C3Q8"},{"q":"For a 2-input AND, A=1 and B=0 gives what output?","o":["0","1","Toggle","Invalid"],"a":0,"e":"Both inputs must be 1.","difficulty":"hard","id":"C3Q9"},{"q":"A two-input truth table has how many input combinations?","o":["2","3","4","8"],"a":2,"e":"Two variables produce 2^2 = 4 combinations.","difficulty":"easy","id":"C3Q10"}]},{"title":"Boolean Algebra and K-Maps","summary":"Boolean laws, DeMorgan, SOP, POS, truth tables, simplification, minterms, maxterms, and K-maps","questions":[{"q":"The identity A+0 equals what?","o":["0","1","A","A complement"],"a":2,"e":"OR with zero leaves A unchanged.","difficulty":"easy","id":"C4Q1"},{"q":"The identity A\u00b71 equals what?","o":["0","1","A","A complement"],"a":2,"e":"AND with one leaves A unchanged.","difficulty":"medium","id":"C4Q2"},{"q":"The complement expression A + A complement equals what?","o":["0","1","A","Undefined"],"a":1,"e":"A variable OR its complement is 1.","difficulty":"hard","id":"C4Q3"},{"q":"The complement expression A\u00b7A complement equals what?","o":["0","1","A","Undefined"],"a":0,"e":"A variable AND its complement is 0.","difficulty":"easy","id":"C4Q4"},{"q":"The idempotent expression A+A equals what?","o":["0","1","A","A complement"],"a":2,"e":"Repeating a variable under OR does not change it.","difficulty":"medium","id":"C4Q5"},{"q":"By absorption, A + AB equals what?","o":["B","AB","A","A+B"],"a":2,"e":"A absorbs the product AB.","difficulty":"hard","id":"C4Q6"},{"q":"DeMorgan says complement of A+B equals what?","o":["A complement + B complement","A complement \u00b7 B complement","AB","A+B"],"a":1,"e":"The complement of OR becomes AND of complements.","difficulty":"easy","id":"C4Q7"},{"q":"SOP stands for what?","o":["Sum of Products","System of Pulses","State of Power","Sequence of Products"],"a":0,"e":"SOP is an OR of product terms.","difficulty":"medium","id":"C4Q8"},{"q":"A K-map group size must normally be what?","o":["Any odd number","A power of two","Exactly three","A prime"],"a":1,"e":"Valid groups have 1, 2, 4, 8, and so on cells.","difficulty":"hard","id":"C4Q9"},{"q":"Dont-care cells may be used when they do what?","o":["Complicate the expression","Help create larger useful groups","Change all zeros to ones","Remove inputs"],"a":1,"e":"Don\u2019t-cares are included only when they improve simplification.","difficulty":"easy","id":"C4Q10"}]},{"title":"Combinational Circuits","summary":"Adders, subtractors, comparators, decoders, encoders, multiplexers, and demultiplexers","questions":[{"q":"A combinational circuit output depends on what?","o":["Present inputs only","Past states only","Clock history only","Stored data only"],"a":0,"e":"Combinational logic has no state memory.","difficulty":"easy","id":"C5Q1"},{"q":"A half adder sum output is which operation?","o":["AND","OR","XOR","XNOR"],"a":2,"e":"The sum is A XOR B.","difficulty":"medium","id":"C5Q2"},{"q":"A half adder carry output is which operation?","o":["AND","OR","XOR","NOT"],"a":0,"e":"The carry is A AND B.","difficulty":"hard","id":"C5Q3"},{"q":"A full adder has how many principal input bits?","o":["One","Two","Three","Four"],"a":2,"e":"It adds A, B, and carry-in.","difficulty":"easy","id":"C5Q4"},{"q":"A decoder with n inputs can have how many outputs?","o":["n","n+1","2n","2^n"],"a":3,"e":"A binary decoder activates one of 2^n outputs.","difficulty":"medium","id":"C5Q5"},{"q":"An encoder performs the reverse function of what?","o":["Adder","Decoder","Register","Latch"],"a":1,"e":"An encoder maps active input lines to a binary code.","difficulty":"hard","id":"C5Q6"},{"q":"A multiplexer does what?","o":["Routes one selected input to one output","Stores a bit","Counts pulses","Inverts every input"],"a":0,"e":"A MUX selects one data input.","difficulty":"easy","id":"C5Q7"},{"q":"A demultiplexer routes what?","o":["Many inputs to one output","One input to a selected output","A clock to memory only","Two sums to a carry"],"a":1,"e":"A DEMUX directs one input to one of several outputs.","difficulty":"medium","id":"C5Q8"},{"q":"A 4-to-1 MUX needs how many select lines?","o":["1","2","3","4"],"a":1,"e":"Two selection bits choose among four inputs.","difficulty":"hard","id":"C5Q9"},{"q":"A comparator determines what?","o":["Only parity","Relative magnitude or equality","Clock frequency","Memory state only"],"a":1,"e":"Comparators indicate greater than, less than, or equal.","difficulty":"easy","id":"C5Q10"}]},{"title":"Sequential Circuits","summary":"State, clocks, triggering, SR/JK/D/T flip-flops, latches, feedback, and memory","questions":[{"q":"Sequential circuit outputs depend on what?","o":["Present inputs only","Present inputs and previous state","Voltage only","Gate count only"],"a":1,"e":"Sequential logic includes state or memory.","difficulty":"easy","id":"C6Q1"},{"q":"What element distinguishes many sequential circuits?","o":["Memory","No feedback","No state","Only analog input"],"a":0,"e":"Memory retains previous-state information.","difficulty":"medium","id":"C6Q2"},{"q":"A D flip-flop primarily stores how many bits?","o":["1","2","4","8"],"a":0,"e":"A flip-flop stores one bit.","difficulty":"hard","id":"C6Q3"},{"q":"When J=K=1, a JK flip-flop normally does what?","o":["Resets","Sets","Toggles","Holds permanently"],"a":2,"e":"The JK state toggles for J=K=1.","difficulty":"easy","id":"C6Q4"},{"q":"A T flip-flop with T=0 normally does what?","o":["Toggles","Holds its state","Sets to 1","Becomes invalid"],"a":1,"e":"T=0 means no change.","difficulty":"medium","id":"C6Q5"},{"q":"A T flip-flop with T=1 normally does what?","o":["Holds","Toggles","Always resets","Always sets"],"a":1,"e":"T=1 complements the current state on the active trigger.","difficulty":"hard","id":"C6Q6"},{"q":"A D flip-flop transfers which value at the active clock event?","o":["D input","Always 0","Always 1","J XOR K"],"a":0,"e":"The next Q follows D at the triggering event.","difficulty":"easy","id":"C6Q7"},{"q":"A positive edge is which transition?","o":["1 to 0","0 to 1","0 to 0","1 to 1"],"a":1,"e":"Positive-edge triggering occurs on LOW-to-HIGH transition.","difficulty":"medium","id":"C6Q8"},{"q":"A latch is commonly described as what?","o":["Edge-triggered only","Level-sensitive storage","A combinational adder","A decoder"],"a":1,"e":"Latches respond while an enable level is active.","difficulty":"hard","id":"C6Q9"},{"q":"Feedback in a sequential circuit helps provide what?","o":["State retention","Number conversion","Analog sampling","Wire color"],"a":0,"e":"Feedback supports memory of previous output.","difficulty":"easy","id":"C6Q10"}]}],glossaryData=[["Digital signal","A signal represented using discrete states, commonly 0 and 1."],["ADC","Analog-to-digital converter."],["DAC","Digital-to-analog converter."],["Duty cycle","Pulse width divided by period, expressed as a percentage."],["Bit","A binary digit."],["Nibble","A group of four bits."],["Byte","A group of eight bits."],["Two\u2019s complement","Common signed-binary representation formed by complementing and adding one."],["Gray code","Code in which adjacent values differ by one bit."],["Logic gate","Circuit implementing a Boolean operation."],["NAND","Complement of AND and a universal gate."],["NOR","Complement of OR and a universal gate."],["Minterm","Product term representing a truth-table row where an SOP function is 1."],["Karnaugh map","Visual method for simplifying Boolean functions."],["Half adder","Circuit adding two bits to produce sum and carry."],["Multiplexer","Circuit selecting one of several inputs."],["Decoder","Circuit activating an output corresponding to a binary input."],["Flip-flop","Clocked bistable storage element."],["Latch","Level-sensitive bistable storage element."],["Register","Collection of storage elements used to hold multiple bits."]];let profile=load('digital_profile',{}),practiceState=load('digital_study',{}),history=load('digital_history',[]),badges=load('digital_badges',{}),run=null,tick=null;function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function save(){localStorage.setItem('digital_profile',JSON.stringify(profile));localStorage.setItem('digital_study',JSON.stringify(practiceState));localStorage.setItem('digital_history',JSON.stringify(history));who.textContent=profile.name||'Guest'}function go(n,b){clearInterval(tick);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');({home,study,challenge,exam:examSetup,mastery,glossary,results,profile:profilePage}[n])()}function allItems(){let a=[];chapters.forEach((c,ci)=>c.questions.forEach((q,qi)=>a.push({c,ci,q,qi})));return a}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function stats(ci){let k=Object.keys(practiceState).filter(x=>x.startsWith(ci+'_')),ok=k.filter(x=>practiceState[x].correct).length;return{n:k.length,pct:k.length?Math.round(ok/k.length*100):0}}function home(){app.innerHTML=`<section class="card"><span class="tag">Student edition • ${allItems().length}-question bank</span><h2>Welcome, ${profile.name||'student'}</h2><div class="grid"><div class="metric"><strong>${Object.keys(practiceState).length}</strong><br>practiced</div><div class="metric"><strong>${history.length}</strong><br>assessments</div><div class="metric"><strong>${allItems().length}</strong><br>questions</div></div><p><button class="btn primary" onclick="study()">Practice now</button> <button class="btn secondary" onclick="challenge()">Challenge</button></p></section>`}function study(ci=0){let c=chapters[ci];app.innerHTML=`<section class="card"><h2>${c.title}</h2><p>${c.summary}</p><select onchange="study(+this.value)">${chapters.map((x,i)=>`<option value="${i}" ${i==ci?'selected':''}>Chapter ${i+1}: ${x.title}</option>`).join('')}</select>${c.questions.map((q,i)=>`<div class="question"><b>${i+1}. ${q.q}</b>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="p${ci}_${i}" onchange="answer(${ci},${i},${j})"> ${o}</label>`).join('')}<div id="f${ci}_${i}"></div></div>`).join('')}</section>`}function answer(ci,qi,s){let q=chapters[ci].questions[qi];practiceState[ci+'_'+qi]={correct:s===q.a};save();document.getElementById('f'+ci+'_'+qi).innerHTML=(s===q.a?'<span class="good">Correct. </span>':'<span class="bad">Incorrect. </span>')+q.e}function challenge(){startRun('Challenge',shuffle(allItems()).slice(0,10),300,60)}function examSetup(){app.innerHTML=`<section class="card"><h2>Examination</h2><label>Questions<select id="cnt"><option>10</option><option selected>20</option><option>40</option><option>60</option></select></label><label>Minutes<input id="mins" type="number" value="30"></label><button class="btn primary" onclick="startRun('Examination',shuffle(allItems()).slice(0,+cnt.value),+mins.value*60,60)">Start</button></section>`}function startRun(title,items,seconds,pass){run={title,items,seconds,pass,answers:{},flags:{},idx:0,start:Date.now()};renderRun();tick=setInterval(()=>{run.seconds--;if(window.timer)timer.textContent=fmt(run.seconds);if(run.seconds<=0)submitRun()},1000)}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function renderRun(){let x=run.items[run.idx],sel=run.answers[run.idx];app.innerHTML=`<section class="card"><div class="row"><b>${run.title}</b><span class="timer" id="timer">${fmt(run.seconds)}</span></div><div class="navigator">${run.items.map((_,i)=>`<button class="${i===run.idx?'cur ':''}${run.answers[i]!==undefined?'ans ':''}${run.flags[i]?'flag':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><div class="question"><h2>${run.idx+1}. ${x.q.q}</h2>${x.q.o.map((o,j)=>`<label class="option"><input type="radio" name="r" ${sel===j?'checked':''} onchange="run.answers[run.idx]=${j};renderRun()"> ${o}</label>`).join('')}</div><button class="btn secondary" onclick="jump(${Math.max(0,run.idx-1)})">Previous</button> <button class="btn primary" onclick="jump(${Math.min(run.items.length-1,run.idx+1)})">Next</button> <button class="btn secondary" onclick="submitRun()">Submit</button></section>`}function jump(i){run.idx=i;renderRun()}function submitRun(){clearInterval(tick);let score=run.items.filter((x,i)=>run.answers[i]===x.q.a).length,pct=Math.round(score/run.items.length*100),r={date:new Date().toISOString(),title:run.title,score,total:run.items.length,pct,pass:run.pass,time:Math.round((Date.now()-run.start)/1000)};history.unshift(r);save();report(r)}function mastery(){app.innerHTML=`<section class="card"><h2>Mastery</h2><table><tr><th>Chapter</th><th>Attempted</th><th>Accuracy</th></tr>${chapters.map((c,i)=>{let s=stats(i);return`<tr><td>${c.title}</td><td>${s.n}</td><td>${s.pct}%</td></tr>`}).join('')}</table></section>`}function glossary(){app.innerHTML=`<section class="card"><h2>Glossary</h2><input oninput="drawTerms(this.value)" placeholder="Search"><div id="terms" class="grid"></div></section>`;drawTerms('')}function drawTerms(s){terms.innerHTML=glossaryData.filter(x=>(x[0]+x[1]).toLowerCase().includes(s.toLowerCase())).map(x=>`<div class="term"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}function report(r){app.innerHTML=`<section class="card"><h2>${r.title} report</h2><div class="big">${r.score}/${r.total} (${r.pct}%)</div><p>${r.pct>=r.pass?'Passed':'Not passed'} • ${fmt(r.time)}</p></section>`}function results(){app.innerHTML=`<section class="card"><h2>Reports</h2>${history.map(r=>`<p>${new Date(r.date).toLocaleString()} • ${r.title} • ${r.pct}%</p>`).join('')||'No reports yet.'}</section>`}function profilePage(){app.innerHTML=`<section class="card"><h2>Profile</h2><input id="pn" value="${profile.name||''}" placeholder="Name"><button class="btn primary" onclick="profile.name=pn.value;save();home()">Save</button></section>`}save();home();</script></body></html>
