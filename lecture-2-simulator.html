<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 2 Digital Logic Simulator</title><style>:root{--n:#123b56;--b:#197d91;--v:#6555ad;--g:#f0b23b;--c:#ed625e;--line:#c8e1df}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;color:#17343d;background:linear-gradient(135deg,#fff8e6,#edf9f7,#efecfb)}header{padding:16px 20px;background:linear-gradient(100deg,var(--n),var(--b),var(--v));color:#fff;border-bottom:4px solid var(--g);display:flex;justify-content:space-between}header a{color:#fff}.layout{display:grid;grid-template-columns:285px 1fr}.side{height:calc(100vh - 62px);overflow:auto;padding:13px;background:#fbffff;border-right:1px solid var(--line)}.nav{width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--n);font-weight:800;margin:3px 0;cursor:pointer}.nav.active{background:linear-gradient(100deg,var(--b),var(--v));color:#fff}main{max-width:1050px;padding:20px;width:100%;margin:auto}.card,.lab{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 10px 25px #123b5614}.lab{margin:13px 0;background:#f8ffff;border:2px dashed #7fc2c5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:850;cursor:pointer;background:linear-gradient(100deg,var(--b),var(--v));color:#fff}.btn.alt{background:#e7f2f3;color:var(--n)}.switch.on{background:var(--g);color:#123b56}.lamp{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:#ccd8d9;border:6px solid #70858a;font-weight:900}.lamp.on{background:#ffe45a;box-shadow:0 0 24px var(--g)}table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--line);padding:9px;text-align:center}th{background:var(--n);color:#fff}tr.live{background:#ffefaf;font-weight:900}.callout{background:#fff7dd;border-left:6px solid var(--g);padding:13px;border-radius:10px;margin:12px 0}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.bit{display:inline-grid;place-items:center;width:40px;height:40px;background:var(--n);color:#fff;border-radius:8px;margin:4px;font-weight:900}.q{padding:12px;border:1px solid var(--line);border-radius:10px;margin:9px 0}.q label{display:block;padding:6px}@media(max-width:800px){.layout{display:block}.side{height:auto;max-height:360px}.navlist{display:grid;grid-template-columns:1fr 1fr}main{padding:11px}}</style></head><body><header><b>⚡ Lecture 2 Digital Logic Simulator</b><a href="index.html">Back to Learning Hub</a></header><div class="layout"><aside class="side"><h3>Lecture 2 Modules</h3><div class="navlist" id="nav"></div></aside><main><div id="app"></div></main></div><script>const mods=[["1. Inverter and Negation", "Inverter and Active-LOW Logic", "An inverter produces the complement of its input. A bubble on a logic symbol indicates inversion or active-LOW behavior.", "not"], ["2. Inverter Timing and 1's Complement", "Timing and Binary Complement", "Analyze every interval between input transitions. Applying NOT to every bit creates the 1's complement.", "invertbits"], ["3. AND Gate", "AND Logic", "AND is HIGH only when every input is HIGH. For n inputs, the truth table contains 2^n rows.", "and"], ["4. AND Enable Applications", "Enable and Interlock Control", "AND can enable a signal, count pulses during a measurement window, or require several safety conditions simultaneously.", "enable"], ["5. OR Gate", "OR Logic", "OR is HIGH when one or more inputs are HIGH. It combines multiple independent causes of one action.", "or"], ["6. NAND Gate", "NAND and Universality", "NAND is NOT-AND. It is LOW only for 11 and can implement NOT, AND, and OR.", "nand"], ["7. NOR Gate", "NOR and Universality", "NOR is NOT-OR. It is HIGH only for 00 and can also implement every basic Boolean function.", "nor"], ["8. DeMorgan and Bubble Logic", "Equivalent Gate Interpretations", "DeMorgan's theorems relate complemented products and sums and explain valid bubble movement.", "demorgan"], ["9. XOR Gate", "Exclusive-OR", "XOR is HIGH when two inputs are different. It supports modulo-2 addition and mismatch detection.", "xor"], ["10. XNOR Gate", "Exclusive-NOR", "XNOR is HIGH when two inputs are equal. It supports equality and agreement detection.", "xnor"], ["11. Half Adder and Failure Detection", "XOR Applications", "A half adder uses XOR for Sum and AND for Carry. XOR can detect disagreement between redundant outputs.", "half"], ["12. Lecture 2 Quiz", "Mastery Quiz", "Answer all questions and review any incorrect gate rules.", "quiz"]];const quiz=[["NOT of 0 is", ["0", "1"], 1], ["AND is HIGH for", ["00", "11", "01"], 1], ["OR is LOW for", ["00", "11", "10"], 0], ["NAND is LOW for", ["11", "00", "01"], 0], ["NOR is HIGH for", ["00", "11", "10"], 0], ["XOR is HIGH when inputs are", ["equal", "different"], 1], ["XNOR is HIGH when inputs are", ["equal", "different"], 0], ["Universal gates are", ["NAND and NOR", "XOR and XNOR"], 0], ["Half-adder sum uses", ["XOR", "NOR"], 0], ["Half-adder carry uses", ["AND", "OR"], 0]];let A=0,B=0,currentGate='NOT';function calc(g,a,b){return {NOT:1-a,AND:a&b,OR:a|b,NAND:1-(a&b),NOR:1-(a|b),XOR:a^b,XNOR:1-(a^b)}[g]}function gateLab(g){currentGate=g;let two=g!=='NOT',y=calc(g,A,B),rows='';for(let i=0;i<(two?4:2);i++){let a=two?i>>1:i,b=two?i&1:0;rows+=`<tr class="${a===A&&(!two||b===B)?'live':''}"><td>${a}</td>${two?`<td>${b}</td>`:''}<td>${calc(g,a,b)}</td></tr>`}return `<div class="lab"><div class="controls"><button class="btn alt switch ${A?'on':''}" onclick="A=1-A;renderLab()">A = ${A}</button>${two?`<button class="btn alt switch ${B?'on':''}" onclick="B=1-B;renderLab()">B = ${B}</button>`:''}<div class="lamp ${y?'on':''}">X = ${y}</div></div><table><tr><th>A</th>${two?'<th>B</th>':''}<th>Output</th></tr>${rows}</table></div>`}function renderLab(){document.getElementById('interactive').innerHTML=gateLab(currentGate)}function moduleBody(m){let [t,h,e,type]=m;if(type==='quiz')return quizBody();let body=`<div class="card"><h1>${h}</h1><p>${e}</p>`;if(['not','and','or','nand','nor','xor','xnor'].includes(type)){let g=type.toUpperCase();body+=`<div class="callout"><b>Boolean operation:</b> ${g==='NOT'?'X = not A':`X = A ${g.toLowerCase()} B`}</div><div id="interactive">${gateLab(g)}</div>`}else if(type==='invertbits'){body+=`<div class="lab"><label>8-bit value: <input id="bits" value="10110010" maxlength="8" oninput="invertBits()"></label><p id="bitOut"></p></div>`}else if(type==='enable'){body+=`<div class="lab"><div class="controls"><button class="btn alt" onclick="A=1-A;enableDemo()">DATA = <span id="ed">0</span></button><button class="btn alt" onclick="B=1-B;enableDemo()">ENABLE = <span id="ee">0</span></button><div id="el" class="lamp">OUT=0</div></div></div>`}else if(type==='demorgan'){body+=`<div class="grid"><div class="callout"><b>(A·B)̅ = A̅ + B̅</b><p>A NAND function equals OR with both inputs complemented.</p></div><div class="callout"><b>(A+B)̅ = A̅·B̅</b><p>A NOR function equals AND with both inputs complemented.</p></div></div><div id="interactive">${gateLab('NAND')}</div>`}else if(type==='half'){body+=`<div class="lab controls"><button class="btn alt" onclick="A=1-A;halfDemo()">A=<span id="ha">0</span></button><button class="btn alt" onclick="B=1-B;halfDemo()">B=<span id="hb">0</span></button><div class="lamp" id="hs">SUM=0</div><div class="lamp" id="hc">CARRY=0</div></div>`}body+=`<div class="callout"><b>Learning check:</b> Change every input combination and explain why the output changes.</div></div>`;return body}function show(i){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.getElementById('n'+i).classList.add('active');document.getElementById('app').innerHTML=moduleBody(mods[i]);let type=mods[i][3];if(type==='invertbits')invertBits();if(type==='enable')enableDemo();if(type==='half')halfDemo();window.scrollTo({top:0,behavior:'smooth'})}function invertBits(){let v=(document.getElementById('bits').value||'').replace(/[^01]/g,'').slice(0,8);document.getElementById('bits').value=v;document.getElementById('bitOut').innerHTML=`Original: ${[...v].map(x=>`<span class="bit">${x}</span>`).join('')}<br>1's complement: ${[...v].map(x=>`<span class="bit">${1-+x}</span>`).join('')}`}function enableDemo(){let y=A&B;document.getElementById('ed').textContent=A;document.getElementById('ee').textContent=B;let l=document.getElementById('el');l.textContent='OUT='+y;l.classList.toggle('on',y)}function halfDemo(){document.getElementById('ha').textContent=A;document.getElementById('hb').textContent=B;let s=A^B,c=A&B,ls=document.getElementById('hs'),lc=document.getElementById('hc');ls.textContent='SUM='+s;lc.textContent='CARRY='+c;ls.classList.toggle('on',s);lc.classList.toggle('on',c)}function quizBody(){return `<div class="card"><h1>Lecture 2 Mastery Quiz</h1><p>Answer all ${quiz.length} questions.</p><div id="quiz">${quiz.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}<div id="f${i}"></div></div>`).join('')}</div><button class="btn" onclick="grade()">Submit quiz</button><h2 id="score"></h2></div>`}function grade(){let score=0;quiz.forEach((q,i)=>{let p=document.querySelector(`input[name=q${i}]:checked`),f=document.getElementById('f'+i);if(!p){f.textContent='Please answer.';return}let ok=+p.value===q[2];if(ok)score++;f.textContent=ok?'✓ Correct':'✗ Correct answer: '+q[1][q[2]];f.style.color=ok?'#138568':'#bd4052'});document.getElementById('score').textContent=`Score: ${score}/${quiz.length} (${Math.round(score/quiz.length*100)}%)`}document.getElementById('nav').innerHTML=mods.map((m,i)=>`<button class="nav" id="n${i}" onclick="show(${i})">${m[0]}</button>`).join('');show(0);</script></body></html>
