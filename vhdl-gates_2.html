<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VHDL Learning Library</title>
<style>
:root{--bg:#071527;--panel:#0e2238;--panel2:#122b45;--text:#ebf7ff;--muted:#9eb7ca;--teal:#26d0ce;--violet:#a78bfa;--coral:#fb7185;--gold:#fbbf24;--line:#28445e}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#061321,#10213b);color:var(--text)}header{padding:32px max(20px,5vw);border-bottom:1px solid var(--line);background:#071527dd;position:sticky;top:0;z-index:3;backdrop-filter:blur(10px)}header h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.7rem)}header p{margin:0;color:var(--muted)}main{max-width:1200px;margin:auto;padding:28px 20px 70px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 16px;border-radius:999px;cursor:pointer;font-weight:700}.tab.active{background:var(--teal);color:#04202d;border-color:transparent}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 30px #0003}.badge{display:inline-block;color:#061321;background:var(--gold);padding:4px 9px;border-radius:999px;font-size:.75rem;font-weight:800}.card h2{font-size:1.15rem;margin:14px 0 8px}.card p{color:var(--muted);min-height:44px}.open{width:100%;border:0;border-radius:10px;background:var(--violet);color:#100b28;padding:10px;font-weight:800;cursor:pointer}.lesson{display:none;margin-top:26px}.lesson.show{display:block}.lessonTop{display:flex;justify-content:space-between;gap:18px;align-items:start}.back{background:none;border:1px solid var(--line);color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}.summary{color:var(--muted)}.codebox{background:#020914;border:1px solid var(--line);border-radius:14px;overflow:auto;margin:18px 0}.code-line{display:grid;grid-template-columns:48px 1fr;min-width:680px}.code-line:hover{background:#10213b}.num{padding:7px 12px;color:#5f7f98;text-align:right;user-select:none;border-right:1px solid #16314a}.src{padding:7px 14px;white-space:pre;font-family:Consolas,monospace;color:#d9f2ff}.explain{display:grid;gap:10px}.exrow{display:grid;grid-template-columns:46px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.exrow b{color:var(--teal)}.note{border-left:4px solid var(--gold);background:#2a2515;padding:14px;border-radius:10px;margin:16px 0}a{color:var(--teal)}@media(max-width:600px){.lessonTop{display:block}.back{margin-top:10px}.exrow{grid-template-columns:1fr}.code-line{min-width:600px}}
</style></head><body>
<header><h1>VHDL Learning Library</h1><p>Explore digital circuits by category, read synthesizable examples, and understand every line.</p></header>
<main><div id="browse"><div class="tabs"><button class="tab active" data-cat="all">All</button><button class="tab" data-cat="basic">Basic Gates</button><button class="tab" data-cat="comb">Combinational</button><button class="tab" data-cat="seq">Sequential</button></div><div id="grid" class="grid"></div></div><section id="lesson" class="lesson"></section></main>
<script>
const circuits=[
{id:'buffer',cat:'basic',name:'Buffer / Driver',desc:'Copies the input logic value to the output.',ports:'a : in std_logic; y : out std_logic',body:['y <= a;']},
{id:'not',cat:'basic',name:'NOT Gate',desc:'Produces the logical complement of the input.',ports:'a : in std_logic; y : out std_logic',body:['y <= not a;']},
{id:'and',cat:'basic',name:'AND Gate',desc:'Output is 1 only when both inputs are 1.',ports:'a, b : in std_logic; y : out std_logic',body:['y <= a and b;']},
{id:'or',cat:'basic',name:'OR Gate',desc:'Output is 1 when either input is 1.',ports:'a, b : in std_logic; y : out std_logic',body:['y <= a or b;']},
{id:'nand',cat:'basic',name:'NAND Gate',desc:'Complement of the AND operation.',ports:'a, b : in std_logic; y : out std_logic',body:['y <= a nand b;']},
{id:'nor',cat:'basic',name:'NOR Gate',desc:'Complement of the OR operation.',ports:'a, b : in std_logic; y : out std_logic',body:['y <= a nor b;']},
{id:'xor',cat:'basic',name:'XOR Gate',desc:'Output is 1 when the inputs are different.',ports:'a, b : in std_logic; y : out std_logic',body:['y <= a xor b;']},
{id:'xnor',cat:'basic',name:'XNOR Gate',desc:'Output is 1 when the inputs are equal.',ports:'a, b : in std_logic; y : out std_logic',body:['y <= a xnor b;']},
{id:'tri_state',cat:'comb',name:'Tri-State Driver',desc:'Drives data or disconnects using high impedance.',ports:'a, enable : in std_logic; y : out std_logic',body:["y <= a when enable = '1' else 'Z';"]},
{id:'mux2',cat:'comb',name:'2-to-1 Multiplexer',desc:'Selects one of two inputs.',ports:'a, b, sel : in std_logic; y : out std_logic',body:["y <= a when sel = '0' else b;"]},
{id:'decoder',cat:'comb',name:'2-to-4 Decoder',desc:'Activates one output selected by a 2-bit input.',ports:'a : in std_logic_vector(1 downto 0); y : out std_logic_vector(3 downto 0)',body:['with a select','  y <= "0001" when "00",','       "0010" when "01",','       "0100" when "10",','       "1000" when others;']},
{id:'half_adder',cat:'comb',name:'Half Adder',desc:'Adds two bits and produces sum and carry.',ports:'a, b : in std_logic; sum, carry : out std_logic',body:['sum <= a xor b;','carry <= a and b;']},
{id:'full_adder',cat:'comb',name:'Full Adder',desc:'Adds two bits plus carry-in.',ports:'a, b, cin : in std_logic; sum, cout : out std_logic',body:['sum <= a xor b xor cin;','cout <= (a and b) or (cin and (a xor b));']},
{id:'comparator',cat:'comb',name:'4-bit Comparator',desc:'Reports equal, greater-than, and less-than.',ports:'a, b : in unsigned(3 downto 0); eq, gt, lt : out std_logic',extra:['use ieee.numeric_std.all;'],body:["eq <= '1' when a = b else '0';","gt <= '1' when a > b else '0';","lt <= '1' when a < b else '0';"]},
{id:'alu',cat:'comb',name:'Simple 4-bit ALU',desc:'Selects add, subtract, AND, or OR.',ports:'a, b : in unsigned(3 downto 0); op : in std_logic_vector(1 downto 0); y : out unsigned(3 downto 0)',extra:['use ieee.numeric_std.all;'],body:['with op select','  y <= a + b when "00",','       a - b when "01",','       a and b when "10",','       a or b when others;']},
{id:'latch',cat:'seq',name:'D Latch',desc:'Stores D while enable is active.',ports:'d, enable : in std_logic; q : out std_logic',body:['process(d, enable)','begin',"  if enable = '1' then","    q <= d;",'  end if;','end process;']},
{id:'dff',cat:'seq',name:'D Flip-Flop',desc:'Captures D on the rising clock edge.',ports:'clk, reset, d : in std_logic; q : out std_logic',body:['process(clk, reset)','begin',"  if reset = '1' then","    q <= '0';",'  elsif rising_edge(clk) then','    q <= d;','  end if;','end process;']},
{id:'jkff',cat:'seq',name:'JK Flip-Flop',desc:'Set, reset, hold, or toggle on a clock edge.',ports:'clk, reset, j, k : in std_logic; q : out std_logic',signals:['signal qi : std_logic := \'0\';'],body:['process(clk, reset)','begin',"  if reset = '1' then","    qi <= '0';",'  elsif rising_edge(clk) then','    case j & k is','      when "00" => null;','      when "01" => qi <= \'0\';','      when "10" => qi <= \'1\';','      when others => qi <= not qi;','    end case;','  end if;','end process;','q <= qi;']},
{id:'register',cat:'seq',name:'4-bit Register',desc:'Stores four bits when load is active.',ports:'clk, reset, load : in std_logic; d : in std_logic_vector(3 downto 0); q : out std_logic_vector(3 downto 0)',body:['process(clk, reset)','begin',"  if reset = '1' then",'    q <= (others => \'0\');','  elsif rising_edge(clk) then',"    if load = '1' then",'      q <= d;','    end if;','  end if;','end process;']},
{id:'shift_register',cat:'seq',name:'4-bit Shift Register',desc:'Shifts serial data through four storage bits.',ports:'clk, reset, serial_in : in std_logic; q : out std_logic_vector(3 downto 0)',signals:["signal r : std_logic_vector(3 downto 0) := (others => '0');"],body:['process(clk, reset)','begin',"  if reset = '1' then",'    r <= (others => \'0\');','  elsif rising_edge(clk) then','    r <= r(2 downto 0) & serial_in;','  end if;','end process;','q <= r;']},
{id:'counter',cat:'seq',name:'4-bit Counter',desc:'Counts upward on each rising clock edge.',ports:'clk, reset, enable : in std_logic; q : out unsigned(3 downto 0)',extra:['use ieee.numeric_std.all;'],signals:["signal count : unsigned(3 downto 0) := (others => '0');"],body:['process(clk, reset)','begin',"  if reset = '1' then",'    count <= (others => \'0\');','  elsif rising_edge(clk) then',"    if enable = '1' then",'      count <= count + 1;','    end if;','  end if;','end process;','q <= count;']},
{id:'fsm',cat:'seq',name:'Two-State FSM',desc:'A minimal finite-state-machine template.',ports:'clk, reset, x : in std_logic; y : out std_logic',decl:['type state_t is (IDLE, ACTIVE);','signal state : state_t := IDLE;'],body:['process(clk, reset)','begin',"  if reset = '1' then",'    state <= IDLE;','  elsif rising_edge(clk) then','    case state is','      when IDLE =>',"        if x = '1' then state <= ACTIVE; end if;",'      when ACTIVE =>',"        if x = '0' then state <= IDLE; end if;",'    end case;','  end if;','end process;',"y <= '1' when state = ACTIVE else '0';"]}
];
const labels={basic:'Basic Gate',comb:'Combinational',seq:'Sequential'};
function code(c){const lines=['library ieee;','use ieee.std_logic_1164.all;',...(c.extra||[]),'',`entity ${c.id} is`,'  port(',...c.ports.split('; ').map((p,i,a)=>'    '+p+(i<a.length-1?';':'')),'  );',`end entity ${c.id};`,'',`architecture rtl of ${c.id} is`,...(c.decl||c.signals||[]).map(x=>'  '+x),'begin',...c.body.map(x=>'  '+x),`end architecture rtl;`];return lines}
function explain(line){const s=line.trim();if(!s)return 'Blank line separates the major sections and improves readability.';if(s==='library ieee;')return 'Makes the IEEE library available to this design unit.';if(s.startsWith('use ieee.std_logic_1164'))return 'Imports standard digital-logic types and operators such as std_logic, AND, and XOR.';if(s.startsWith('use ieee.numeric_std'))return 'Imports portable arithmetic operations for signed and unsigned vectors.';if(s.startsWith('entity '))return 'Begins the external interface declaration of this circuit.';if(s==='port(')return 'Starts the list of input and output ports.';if(s.includes(': in '))return 'Declares one or more input signals and their data type.';if(s.includes(': out '))return 'Declares one or more output signals and their data type.';if(s===');')return 'Closes the port list.';if(s.startsWith('end entity'))return 'Ends the entity declaration.';if(s.startsWith('architecture '))return 'Begins the RTL implementation connected to the entity.';if(s==='begin')return 'Starts executable concurrent statements, or the sequential body of a process.';if(s.startsWith('end architecture'))return 'Ends the RTL architecture.';if(s.startsWith('signal '))return 'Declares an internal signal used to store or connect values.';if(s.startsWith('type '))return 'Defines a custom enumerated type used for readable FSM states.';if(s.startsWith('process('))return 'Starts a process and lists signals that can wake it in simulation.';if(s.startsWith('if reset'))return 'Checks asynchronous reset first, giving reset the highest priority.';if(s.startsWith('elsif rising_edge'))return 'Runs the following synchronous logic only on a rising clock edge.';if(s.startsWith('if ')||s.startsWith('case '))return 'Begins a conditional decision.';if(s.startsWith('elsif ')||s.startsWith('when '))return 'Selects a condition or one alternative of a case statement.';if(s.startsWith('else'))return 'Selects the alternative branch when the condition is false.';if(s.startsWith('end if'))return 'Ends the current if statement.';if(s.startsWith('end case'))return 'Ends the case statement.';if(s.startsWith('end process'))return 'Ends the sequential process.';if(s==='with a select'||s==='with op select')return 'Begins a selected concurrent assignment controlled by the selector.';if(s.includes('<='))return 'Assigns the expression on the right to the signal on the left; in hardware this describes logic or a stored update.';return 'Part of the VHDL declaration or control structure needed to describe this circuit.'}
function render(cat='all'){grid.innerHTML=circuits.filter(c=>cat==='all'||c.cat===cat).map(c=>`<article class="card"><span class="badge">${labels[c.cat]}</span><h2>${c.name}</h2><p>${c.desc}</p><button class="open" onclick="showLesson('${c.id}')">View code & explanation</button></article>`).join('')}
function showLesson(id){const c=circuits.find(x=>x.id===id),lines=code(c);browse.style.display='none';lesson.classList.add('show');lesson.innerHTML=`<div class="lessonTop"><div><span class="badge">${labels[c.cat]}</span><h2>${c.name}</h2><p class="summary">${c.desc}</p></div><button class="back" onclick="goBack()">← Back to library</button></div><div class="note"><b>Learning note:</b> This is a compact, synthesizable teaching example. Tool-specific pin constraints and a testbench are added separately.</div><h3>VHDL code</h3><div class="codebox">${lines.map((l,i)=>`<div class="code-line"><span class="num">${i+1}</span><span class="src">${esc(l)}</span></div>`).join('')}</div><h3>Line-by-line explanation</h3><div class="explain">${lines.map((l,i)=>`<div class="exrow"><b>Line ${i+1}</b><span><code>${esc(l||'(blank)')}</code><br>${explain(l)}</span></div>`).join('')}</div>`;scrollTo(0,0)}
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function goBack(){lesson.classList.remove('show');browse.style.display='block';scrollTo(0,0)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelector('.tab.active').classList.remove('active');b.classList.add('active');render(b.dataset.cat)});render();
</script></body></html>
