<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Foundations of Digital Circuits</title>
  <style>
    :root {
      --navy: #12395a;
      --blue: #1976a8;
      --cyan: #2aaac7;
      --green: #2d8f69;
      --paper: #fff;
      --bg: #eef7fa;
      --line: #bcd9e3;
      --text: #18313f;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #f8fcfd, #e5f2f5);
      color: var(--text);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .15;
      background-image:
        linear-gradient(90deg, transparent 49%, #199ec733 50%, transparent 51%),
        linear-gradient(transparent 49%, #199ec733 50%, transparent 51%);
      background-size: 64px 64px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(110deg, #12395a, #1d6685);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      border-bottom: 4px solid #55c8c4;
      box-shadow: 0 4px 16px #12395a44;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 30px);
    }

    .sub {
      color: #c8f2f5;
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 9px;
    }

    .btn,
    .toolbar button,
    .toolbar input {
      border: 1px solid #78b8ca;
      border-radius: 10px;
      padding: 9px 13px;
      background: #fff;
      color: #12395a;
      font-weight: 750;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 7px 15px #08243d44;
    }

    .practical-btn {
      color: #fff;
      background: var(--green);
      border-color: #8de0bd;
    }

    .practical-btn:hover,
    .practical-btn:focus-visible {
      background: #247858;
    }

    .wrap {
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .toolbar {
      display: flex;
      gap: 9px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      background: #fffffff0;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 9px 14px;
      margin-bottom: 12px;
      box-shadow: 0 5px 16px #18466322;
    }

    .toolbar input { width: 70px; }

    .book-shell {
      width: min(1240px, 97vw);
      height: calc(100vh - 170px);
      min-height: 300px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
    }

    .flip-book {
      display: none;
      filter: drop-shadow(0 18px 22px #19384b55);
    }

    .page {
      background: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px #9dcbd7;
    }

    .page canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }

    .link-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .pdf-link {
      position: absolute;
      pointer-events: auto;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .pdf-link:hover {
      background: #4fc3d633;
      outline: 2px solid #1aa1be;
    }

    .loading {
      padding: 32px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 17px;
      text-align: center;
    }

    .watermark {
      position: absolute;
      bottom: 9px;
      left: 0;
      right: 0;
      text-align: center;
      color: #1976a833;
      font-size: 12px;
      font-weight: bold;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .book-shell { height: calc(100vh - 275px); }
      .hint { display: none; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>Foundations of Digital Circuits</h1>
      <div class="sub">Light electronics edition • clickable contents</div>
    </div>

    <nav class="header-actions" aria-label="Learning resources">
      <a
        class="btn practical-btn"
        href="Additional_book%20(1).pdf"
        target="_blank"
        rel="noopener noreferrer"
        title="Open the practical book in a new tab"
      >
        📘 Practical Book
      </a>

      <a class="btn" href="studio.html">Interactive Activities</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <button id="prev" type="button">Previous</button>
      <span id="status">Preparing...</span>
      <span class="hint">Contents and document links are clickable</span>
      <button id="next" type="button">Next</button>
      <label>Page <input id="pageNo" type="number" min="1" value="1"></label>
    </div>

    <div class="book-shell">
      <div id="loading" class="loading">
        <h2>Loading digital flipbook</h2>
        <p>Preparing pages and links...</p>
      </div>
      <div id="book" class="flip-book"></div>
    </div>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let book;
    let total = 0;
    let pdfDoc;

    const bookEl = document.getElementById('book');
    const loadingEl = document.getElementById('loading');
    const statusEl = document.getElementById('status');
    const pageNoEl = document.getElementById('pageNo');
    const prevEl = document.getElementById('prev');
    const nextEl = document.getElementById('next');

    async function destPage(dest) {
      try {
        const d = typeof dest === 'string'
          ? await pdfDoc.getDestination(dest)
          : dest;

        if (!d) return null;

        return typeof d[0] === 'object'
          ? (await pdfDoc.getPageIndex(d[0])) + 1
          : Number.isInteger(d[0])
            ? d[0] + 1
            : null;
      } catch (error) {
        return null;
      }
    }

    async function links(pdfPage, pageDiv, viewport) {
      const annotations = await pdfPage.getAnnotations({ intent: 'display' });
      const layer = document.createElement('div');
      layer.className = 'link-layer';

      for (const annotation of annotations) {
        if (annotation.subtype !== 'Link' || !annotation.rect) continue;

        const rect = viewport.convertToViewportRectangle(annotation.rect);
        const x = Math.min(rect[0], rect[2]);
        const y = Math.min(rect[1], rect[3]);
        const width = Math.abs(rect[2] - rect[0]);
        const height = Math.abs(rect[3] - rect[1]);
        const link = document.createElement('a');

        link.className = 'pdf-link';
        link.href = '#';
        link.style.cssText = `
          left: ${x / viewport.width * 100}%;
          top: ${y / viewport.height * 100}%;
          width: ${width / viewport.width * 100}%;
          height: ${height / viewport.height * 100}%;
        `;

        link.onclick = async event => {
          event.preventDefault();
          event.stopPropagation();

          if (annotation.url) {
            window.open(annotation.url, '_blank', 'noopener');
          } else {
            const page = await destPage(annotation.dest);
            if (page) book.flip(page - 1);
          }
        };

        layer.appendChild(link);
      }

      pageDiv.appendChild(layer);
    }

    async function init() {
      try {
        pdfDoc = await pdfjsLib.getDocument('digital_ebook.pdf').promise;
        total = pdfDoc.numPages;
        pageNoEl.max = total;

        for (let number = 1; number <= total; number++) {
          statusEl.textContent = `Preparing ${number}/${total}`;

          const pdfPage = await pdfDoc.getPage(number);
          const viewport = pdfPage.getViewport({ scale: 1.25 });
          const canvas = document.createElement('canvas');

          canvas.width = viewport.width;
          canvas.height = viewport.height;

          await pdfPage.render({
            canvasContext: canvas.getContext('2d'),
            viewport
          }).promise;

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';

          if (number === 1) pageDiv.dataset.density = 'hard';

          pageDiv.appendChild(canvas);
          await links(pdfPage, pageDiv, viewport);

          const watermark = document.createElement('div');
          watermark.className = 'watermark';
          watermark.textContent = 'FOUNDATIONS OF DIGITAL CIRCUITS';
          pageDiv.appendChild(watermark);

          bookEl.appendChild(pageDiv);
        }

        loadingEl.style.display = 'none';
        bookEl.style.display = 'block';

        book = new St.PageFlip(bookEl, {
          width: 550,
          height: 730,
          size: 'stretch',
          minWidth: 220,
          maxWidth: 650,
          minHeight: 280,
          maxHeight: 760,
          showCover: true,
          mobileScrollSupport: false,
          usePortrait: true,
          drawShadow: true,
          flippingTime: 700
        });

        book.loadFromHTML(document.querySelectorAll('.page'));

        book.on('flip', event => {
          statusEl.textContent = `Page ${event.data + 1} of ${total}`;
          pageNoEl.value = event.data + 1;
        });

        statusEl.textContent = `Page 1 of ${total}`;
      } catch (error) {
        loadingEl.innerHTML = `
          <h2>Unable to load ebook</h2>
          <p>Confirm digital_ebook.pdf is in the same folder.</p>
        `;
      }
    }

    prevEl.onclick = () => book && book.flipPrev();
    nextEl.onclick = () => book && book.flipNext();
    pageNoEl.onchange = () => {
      if (!book) return;
      const requestedPage = Math.max(1, Math.min(total, Number(pageNoEl.value) || 1));
      book.flip(requestedPage - 1);
    };

    init();
  </script>
</body>
</html>
