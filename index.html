<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06111f"><title>Foundations of Digital Circuits</title><style>
:root{--bg:#030912;--panel:#071827;--panel2:#0b2538;--cyan:#22d3ee;--blue:#1687c8;--green:#39ff9a;--text:#ecfeff;--muted:#9ac0d2;--line:#1b526d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#123d59 0,#061522 42%,#02070d 100%);color:var(--text)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(90deg,transparent 49%,#22d3ee44 50%,transparent 51%),linear-gradient(transparent 49%,#22d3ee44 50%,transparent 51%);background-size:54px 54px}header{position:sticky;top:0;z-index:20;background:#04111ded;border-bottom:1px solid var(--cyan);box-shadow:0 5px 25px #000b,0 0 18px #22d3ee33;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 20px}h1{font-size:clamp(20px,3vw,30px);margin:0;letter-spacing:.4px}.subtitle{color:#91e7f4;font-size:13px;margin-top:3px}.btn,.toolbar button,.toolbar input{border:1px solid #2f7d9e;border-radius:10px;padding:9px 13px;background:linear-gradient(#12344a,#081d2c);color:#fff;font-weight:750;box-shadow:inset 0 0 0 1px #ffffff0d,0 0 12px #00c8ff18}.btn{text-decoration:none}.btn:hover,.toolbar button:hover{border-color:var(--cyan);box-shadow:0 0 14px #22d3ee66}.wrap{position:relative;padding:14px 18px 24px;display:flex;flex-direction:column;align-items:center}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:12px;background:#071827e8;border:1px solid var(--line);padding:9px 14px;border-radius:14px;box-shadow:0 8px 22px #0008;color:var(--muted)}.toolbar input{width:72px;text-align:center}.book-shell{width:min(1240px,97vw);height:calc(100vh - 170px);min-height:300px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:8px}.flip-book{display:none;filter:drop-shadow(0 25px 30px #000c)}.page{background:white;box-shadow:inset 0 0 0 1px #72d8ef;overflow:hidden;position:relative}.page canvas{width:100%;height:100%;object-fit:contain;background:#fff}.link-layer{position:absolute;inset:0;pointer-events:none}.pdf-link{position:absolute;pointer-events:auto;cursor:pointer;border:0;background:transparent;padding:0}.pdf-link:hover,.pdf-link:focus{background:#22d3ee35;outline:2px solid var(--cyan)}.watermark{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#077ca238;font-size:12px;font-weight:800;pointer-events:none}.loading{padding:35px;max-width:600px;text-align:center;background:#071827;border:1px solid var(--cyan);border-radius:18px;box-shadow:0 0 30px #22d3ee2e}.chip{display:inline-block;padding:5px 9px;border-radius:999px;background:#05394b;color:#7ff3ff;border:1px solid #167f9c;font-size:12px}.error{color:#ff9c9c}@media(max-width:700px){header{flex-direction:column;align-items:flex-start;padding:10px 12px}.book-shell{height:calc(100vh - 230px)}.wrap{padding:8px}.toolbar{font-size:12px}.toolbar .hint{display:none}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script></head><body><header><div><span class="chip">DIGITAL LEARNING EDITION</span><h1>Foundations of Digital Circuits</h1><div class="subtitle">Interactive clickable flipbook</div></div><a class="btn" href="studio.html">Interactive Activities</a></header><main class="wrap"><div class="toolbar"><button id="prev">&#8592; Previous</button><span id="status">Preparing book...</span><span class="hint">Contents links are clickable. Drag a corner or swipe to turn.</span><button id="next">Next &#8594;</button><label>Page <input id="pageNo" type="number" min="1" value="1"></label></div><div class="book-shell"><div id="loading" class="loading"><h2>Initializing digital flipbook</h2><p>Rendering pages and activating document links...</p></div><div id="book" class="flip-book"></div></div></main><script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let book,total=0,pdfDoc=null;
async function destinationPage(dest){try{const d=typeof dest==='string'?await pdfDoc.getDestination(dest):dest;if(!d)return null;const ref=d[0];return typeof ref==='object'?(await pdfDoc.getPageIndex(ref))+1:Number.isInteger(ref)?ref+1:null}catch(e){return null}}
async function addLinks(pg,holder,vp){const anns=await pg.getAnnotations({intent:'display'}),layer=document.createElement('div');layer.className='link-layer';for(const a of anns){if(a.subtype!=='Link'||!a.rect)continue;const r=vp.convertToViewportRectangle(a.rect),x=Math.min(r[0],r[2]),y=Math.min(r[1],r[3]),w=Math.abs(r[2]-r[0]),h=Math.abs(r[3]-r[1]),el=document.createElement('a');el.className='pdf-link';el.style.cssText=`left:${x/vp.width*100}%;top:${y/vp.height*100}%;width:${w/vp.width*100}%;height:${h/vp.height*100}%`;el.href='#';el.title=a.url?'Open external resource':'Go to section';el.addEventListener('pointerdown',e=>e.stopPropagation());el.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();if(a.url)window.open(a.url,'_blank','noopener');else{const p=await destinationPage(a.dest);if(p&&book)book.flip(p-1)}});layer.appendChild(el)}holder.appendChild(layer)}
async function init(){try{pdfDoc=await pdfjsLib.getDocument('digital_ebook.pdf').promise;total=pdfDoc.numPages;const root=document.getElementById('book');for(let n=1;n<=total;n++){status.textContent=`Preparing page ${n} of ${total}`;const pg=await pdfDoc.getPage(n),vp=pg.getViewport({scale:1.25}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const d=document.createElement('div');d.className='page';if(n===1)d.dataset.density='hard';d.appendChild(c);await addLinks(pg,d,vp);const wm=document.createElement('div');wm.className='watermark';wm.textContent='FOUNDATIONS OF DIGITAL CIRCUITS';d.appendChild(wm);root.appendChild(d)}loading.style.display='none';root.style.display='block';book=new St.PageFlip(root,{width:550,height:730,size:'stretch',minWidth:220,maxWidth:650,minHeight:280,maxHeight:760,showCover:true,mobileScrollSupport:false,usePortrait:true,drawShadow:true,flippingTime:700});book.loadFromHTML(document.querySelectorAll('.page'));book.on('flip',e=>{status.textContent=`Page ${e.data+1} of ${total}`;pageNo.value=e.data+1});status.textContent=`Page 1 of ${total}`}catch(e){loading.innerHTML=`<h2 class="error">The ebook could not be loaded</h2><p>Confirm that digital_ebook.pdf is in the same folder.</p>`}}
function goPage(){if(book)book.flip(Math.max(1,Math.min(total,+pageNo.value||1))-1)}prev.onclick=()=>book&&book.flipPrev();next.onclick=()=>book&&book.flipNext();pageNo.onchange=goPage;init();
</script></body></html>
