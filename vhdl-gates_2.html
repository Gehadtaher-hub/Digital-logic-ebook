<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VHDL Interactive Learning Library</title><style>
:root{--bg:#071527;--p:#0e2238;--p2:#122b45;--t:#ebf7ff;--m:#9eb7ca;--a:#26d0ce;--v:#a78bfa;--c:#fb7185;--g:#fbbf24;--l:#28445e;--ok:#35d39a}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#061321,#10213b);color:var(--t)}header{padding:22px max(18px,4vw);background:#071527ee;border-bottom:3px solid var(--g);position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;align-items:center}header h1{margin:0;font-size:clamp(1.5rem,4vw,2.4rem)}header p{margin:5px 0;color:var(--m)}a{color:var(--a)}main{max-width:1220px;margin:auto;padding:22px}.tabs,.controls,.subtabs{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}.tab,.btn{border:1px solid var(--l);background:var(--p);color:var(--t);padding:10px 14px;border-radius:11px;font-weight:800;cursor:pointer}.tab.active,.btn.primary{background:var(--a);color:#04202d;border-color:transparent}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card,.panel{background:linear-gradient(145deg,var(--p),var(--p2));border:1px solid var(--l);border-radius:17px;padding:18px;box-shadow:0 10px 26px #0003}.card p,.muted{color:var(--m)}.badge{display:inline-block;background:var(--g);color:#071527;border-radius:999px;padding:4px 9px;font-size:.76rem;font-weight:900}.open{width:100%;background:var(--v);border:0;border-radius:9px;padding:10px;font-weight:900;cursor:pointer}.lesson{display:none}.lesson.show{display:block}.lessonTop{display:flex;justify-content:space-between;gap:12px}.labgrid{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px}.switch.on{background:var(--g);color:#071527}.led{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:#324452;border:7px solid #738795;font-weight:900}.led.on{background:#ffe45a;color:#071527;box-shadow:0 0 28px var(--g)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid var(--l);padding:8px;text-align:center}th{background:#071527}tr.live{background:#745f17;font-weight:900}.codebox,pre{background:#020914;border:1px solid var(--l);border-radius:12px;overflow:auto;padding:13px;white-space:pre;font-family:Consolas,monospace;color:#d9f2ff}.code-line{display:grid;grid-template-columns:45px 1fr;min-width:680px}.num{color:#64839a;text-align:right;padding:5px 10px;border-right:1px solid #16314a}.src{padding:5px 12px;white-space:pre}.exrow,.q{background:var(--p);border:1px solid var(--l);border-radius:11px;padding:12px;margin:8px 0}.exrow b{color:var(--a)}.wave{width:100%;height:230px;background:#020914;border:1px solid var(--l);border-radius:12px}.activity{min-height:150px;display:grid;place-items:center;border:2px dashed #47758a;border-radius:13px;padding:15px}.gate{background:var(--v);color:#100b28;padding:22px 38px;border-radius:10px 45px 45px 10px;font-weight:900}.answer{width:100%;min-height:80px;background:#071527;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:12px}.good{color:var(--ok)}.bad{color:var(--c)}label{display:block;padding:5px}@media(max-width:760px){header{position:static;display:block}.labgrid{grid-template-columns:1fr}.lessonTop{display:block}.code-line{min-width:610px}}
</style></head><body><header><div><h1>VHDL Interactive Learning Library</h1><p>Learn, simulate, write, test, and assess digital circuits.</p></div><a href="lectures.html">← Back to Lectures</a></header><main>
<nav class="tabs" id="mainTabs"><button class="tab active" data-view="library">Library</button><button class="tab" data-view="c2v">Circuit → VHDL</button><button class="tab" data-view="v2c">VHDL → Circuit</button><button class="tab" data-view="quiz">Random Quiz</button></nav>
<section id="library" class="view active"><div id="browse"><div class="tabs" id="cats"><button class="tab active" data-cat="all">All</button><button class="tab" data-cat="basic">Basic Gates</button><button class="tab" data-cat="comb">Combinational</button><button class="tab" data-cat="seq">Sequential</button></div><div id="grid" class="grid"></div></div><section id="lesson" class="lesson"></section></section>
<section id="c2v" class="view"><div class="panel"><h2>Circuit-to-VHDL Activity</h2><p>Study the circuit block, then write its concurrent assignment.</p><div class="activity"><div><b>Inputs: <span id="cInputs"></span></b> → <span class="gate" id="cGate"></span> → <b>Y</b></div></div><textarea id="cAns" class="answer" placeholder="Y <= A and B;"></textarea><div class="controls"><button class="btn primary" onclick="checkC2V()">Check</button><button class="btn" onclick="newC2V()">New challenge</button><button class="btn" onclick="hintC2V()">Hint</button></div><p id="cFeed"></p></div></section>
<section id="v2c" class="view"><div class="panel"><h2>VHDL-to-Circuit Activity</h2><pre id="vCode"></pre><p>Select the implemented circuit:</p><div id="vOptions" class="grid"></div><p id="vFeed"></p><button class="btn" onclick="newV2C()">Next challenge</button></div></section>
<section id="quiz" class="view"><div class="panel"><h2>Randomized Quiz</h2><div class="controls"><select id="qCount"><option value="5">5 questions</option><option value="10">10 questions</option></select><button class="btn primary" onclick="startQuiz()">Generate quiz</button></div><div id="qBox"></div><p id="qScore"></p></div></section>
</main><script>
const C=[
['buffer','basic','Buffer / Driver','Copies input A to Y',['A'],'Y <= A;'],['not','basic','NOT Gate','Complements input A',['A'],'Y <= not A;'],['and','basic','AND Gate','HIGH only when both inputs are HIGH',['A','B'],'Y <= A and B;'],['or','basic','OR Gate','HIGH when either input is HIGH',['A','B'],'Y <= A or B;'],['nand','basic','NAND Gate','Complement of AND',['A','B'],'Y <= A nand B;'],['nor','basic','NOR Gate','Complement of OR',['A','B'],'Y <= A nor B;'],['xor','basic','XOR Gate','HIGH when inputs differ',['A','B'],'Y <= A xor B;'],['xnor','basic','XNOR Gate','HIGH when inputs match',['A','B'],'Y <= A xnor B;'],['tri_state','comb','Tri-State Driver','Drives A when enabled, otherwise Z',['A','ENABLE'],"Y <= A when ENABLE = '1' else 'Z';"],['mux2','comb','2-to-1 Multiplexer','Selects A or B using SEL',['A','B','SEL'],"Y <= A when SEL = '0' else B;"],['decoder','comb','2-to-4 Decoder','Activates one of four outputs',['A1','A0'],'selected decoder'],['half_adder','comb','Half Adder','Produces SUM and CARRY',['A','B'],'SUM <= A xor B;
CARRY <= A and B;'],['full_adder','comb','Full Adder','Adds A, B, and carry-in',['A','B','CIN'],'SUM <= A xor B xor CIN;
COUT <= (A and B) or (CIN and (A xor B));'],['comparator','comb','4-bit Comparator','Compares two unsigned values',['A','B'],'EQ/GT/LT comparator'],['alu','comb','Simple 4-bit ALU','Add, subtract, AND, or OR',['A','B','OP'],'selected ALU'],['latch','seq','D Latch','Stores D while ENABLE is HIGH',['D','ENABLE'],'level-sensitive storage'],['dff','seq','D Flip-Flop','Captures D at a rising clock edge',['D','RESET'],'rising-edge storage'],['jkff','seq','JK Flip-Flop','Holds, resets, sets, or toggles',['J','K','RESET'],'JK storage'],['register','seq','4-bit Register','Stores four bits when LOAD is active',['D','LOAD','RESET'],'parallel register'],['shift_register','seq','4-bit Shift Register','Shifts serial data on each clock',['SERIAL_IN','RESET'],'shift register'],['counter','seq','4-bit Counter','Counts on rising clock edges',['ENABLE','RESET'],'binary counter'],['fsm','seq','Two-State FSM','Transitions between IDLE and ACTIVE',['X','RESET'],'finite state machine']
].map(x=>({id:x[0],cat:x[1],name:x[2],desc:x[3],inputs:x[4],stmt:x[5]}));
const labels={basic:'Basic Gate',comb:'Combinational',seq:'Sequential'};let active=null,S={Q:0,count:0};
function design(c){if(c.id==='decoder')return `library ieee;
use ieee.std_logic_1164.all;
entity decoder is port(A: in std_logic_vector(1 downto 0); Y: out std_logic_vector(3 downto 0)); end;
architecture rtl of decoder is begin
 with A select Y <= "0001" when "00", "0010" when "01", "0100" when "10", "1000" when others;
end rtl;`;if(c.id==='dff')return `library ieee;
use ieee.std_logic_1164.all;
entity dff is port(CLK, RESET, D: in std_logic; Q: out std_logic); end;
architecture rtl of dff is begin
 process(CLK, RESET) begin
  if RESET='1' then Q<='0';
  elsif rising_edge(CLK) then Q<=D; end if;
 end process;
end rtl;`;if(c.cat==='seq')return `library ieee;
use ieee.std_logic_1164.all;
entity ${c.id} is port(CLK, RESET: in std_logic; Q: out std_logic); end;
architecture rtl of ${c.id} is begin
 -- ${c.name}: ${c.stmt}
 process(CLK, RESET) begin
  if RESET='1' then Q<='0';
  elsif rising_edge(CLK) then -- update stored state
  end if;
 end process;
end rtl;`;let outs=c.id==='half_adder'?'SUM, CARRY':c.id==='full_adder'?'SUM, COUT':'Y';return `library ieee;
use ieee.std_logic_1164.all;
entity ${c.id} is port(${c.inputs.join(', ')}: in std_logic; ${outs}: out std_logic); end;
architecture rtl of ${c.id} is begin
 ${c.stmt}
end rtl;`}
function testbench(c){let sig=[...c.inputs,(c.id==='dff'?'Q':'Y')].join(', ');return `library ieee;
use ieee.std_logic_1164.all;
entity ${c.id}_tb is end;
architecture sim of ${c.id}_tb is
 signal ${sig}: std_logic := '0';
begin
 uut: entity work.${c.id} port map(/* connect ports */);
 stimulus: process begin
  -- Apply input combinations
  wait for 10 ns;
  wait;
 end process;
end sim;`}
function calc(c,s){let A=s.A||0,B=s.B||0,C=s.CIN||0,E=s.ENABLE||0,SEL=s.SEL||0;if(c.id==='buffer')return A;if(c.id==='not')return 1-A;if(c.id==='and')return A&B;if(c.id==='or')return A|B;if(c.id==='nand')return 1-(A&B);if(c.id==='nor')return 1-(A|B);if(c.id==='xor')return A^B;if(c.id==='xnor')return 1-(A^B);if(c.id==='tri_state')return E?A:'Z';if(c.id==='mux2')return SEL?B:A;if(c.id==='half_adder')return `${A^B}/${A&B}`;if(c.id==='full_adder')return `${A^B^C}/${(A&B)|(C&(A^B))}`;return S.Q||0}
function render(cat='all'){grid.innerHTML=C.filter(c=>cat==='all'||c.cat===cat).map(c=>`<article class="card"><span class="badge">${labels[c.cat]}</span><h2>${c.name}</h2><p>${c.desc}</p><button class="open" onclick="showLesson('${c.id}')">Open interactive lesson</button></article>`).join('')}
function showLesson(id){active=C.find(c=>c.id===id);active.inputs.forEach(k=>S[k]=0);browse.style.display='none';lesson.classList.add('show');lesson.innerHTML=`<div class="lessonTop"><div><span class="badge">${labels[active.cat]}</span><h2>${active.name}</h2><p class="muted">${active.desc}</p></div><button class="btn" onclick="goBack()">← Library</button></div><div class="labgrid"><div class="panel"><h3>Interactive simulator</h3><div id="switches" class="controls"></div>${active.cat==='seq'?'<button class="btn primary" onclick="pulse()">Clock pulse ↑</button>':''}<div id="led" class="led">Y=0</div><div id="truth"></div></div><div class="panel"><div class="subtabs"><button class="btn primary" onclick="showCode('design',this)">Design</button><button class="btn" onclick="showCode('tb',this)">Testbench</button></div><div class="controls"><button class="btn" onclick="copyCode()">Copy</button><button class="btn" onclick="downloadCode()">Download .vhd</button></div><pre id="code"></pre></div></div><div class="panel"><h3>Waveform</h3><canvas id="wave" class="wave" width="1100" height="230"></canvas></div><div class="panel"><h3>Line-by-line explanation</h3><div id="explain"></div></div>`;showCode('design');updateSim();scrollTo(0,0)}
function showCode(kind,b){active.kind=kind;let txt=kind==='tb'?testbench(active):design(active);code.textContent=txt;if(b){b.parentElement.querySelectorAll('.btn').forEach(x=>x.classList.remove('primary'));b.classList.add('primary')}explain.innerHTML=txt.split('
').map((l,i)=>`<div class="exrow"><b>Line ${i+1}</b>: <code>${esc(l||'(blank)')}</code><br>${why(l)}</div>`).join('')}
function why(l){let s=l.trim();if(!s)return 'Separates sections for readability.';if(s.startsWith('library'))return 'Makes the IEEE library available.';if(s.startsWith('use '))return 'Imports standard logic types and operators.';if(s.startsWith('entity'))return 'Declares the circuit interface.';if(s.includes('port'))return 'Declares input and output ports.';if(s.startsWith('architecture'))return 'Starts the implementation.';if(s.startsWith('process'))return 'Starts sequential behavior.';if(s.includes('rising_edge'))return 'Updates storage only on a rising clock edge.';if(s.includes('<='))return 'Assigns a hardware signal value.';if(s.startsWith('wait'))return 'Controls simulation timing in the testbench.';return 'Defines part of the VHDL structure or behavior.'}
function updateSim(){switches.innerHTML=active.inputs.map(k=>`<button class="btn switch ${S[k]?'on':''}" onclick="S.${k}=1-S.${k};updateSim()">${k} = ${S[k]}</button>`).join('');let y=calc(active,S);led.textContent=(active.id==='dff'?'Q':'Y')+' = '+y;led.classList.toggle('on',y===1||String(y).startsWith('1'));truthTable();waveform()}
function pulse(){if(S.RESET)S.Q=0;else if(active.id==='dff')S.Q=S.D;else if(active.id==='counter'&&S.ENABLE)S.Q=((S.Q||0)+1)%16;else S.Q=S.D||S.J||S.X||0;updateSim()}
function truthTable(){if(active.cat==='seq'){truth.innerHTML='<p class="muted">Sequential output depends on the current stored state and clock edge. Use Clock pulse to update it.</p>';return}let n=Math.min(active.inputs.length,3),rows='';for(let i=0;i<2**n;i++){let s={};active.inputs.slice(0,n).forEach((k,j)=>s[k]=(i>>(n-1-j))&1);let live=active.inputs.slice(0,n).every(k=>S[k]===s[k]);rows+=`<tr class="${live?'live':''}">${active.inputs.slice(0,n).map(k=>`<td>${s[k]}</td>`).join('')}<td>${calc(active,s)}</td></tr>`}truth.innerHTML=`<table><tr>${active.inputs.slice(0,n).map(k=>`<th>${k}</th>`).join('')}<th>Output</th></tr>${rows}</table>`}
function waveform(){let x=wave.getContext('2d'),signals=active.inputs.slice(0,3).concat('Y');x.clearRect(0,0,1100,230);x.font='15px Segoe UI';signals.forEach((s,r)=>{let base=35+r*46;x.fillStyle='#d9f2ff';x.fillText(s,10,base+10);x.strokeStyle=['#26d0ce','#fbbf24','#fb7185','#a78bfa'][r];x.lineWidth=3;x.beginPath();let old=0;for(let t=0;t<8;t++){let vals={};active.inputs.forEach((k,j)=>vals[k]=(t>>j)&1);let v=s==='Y'?calc(active,vals):vals[s]||0;if(typeof v!=='number')v=String(v).startsWith('1')?1:0;let px=70+t*125,py=base+(v?0:22);if(t===0)x.moveTo(px,py);else{x.lineTo(px,base+(old?0:22));x.lineTo(px,py)}old=v}x.stroke()})}
function copyCode(){navigator.clipboard.writeText(code.textContent)}function downloadCode(){let a=document.createElement('a'),b=new Blob([code.textContent],{type:'text/plain'});a.href=URL.createObjectURL(b);a.download=active.id+(active.kind==='tb'?'_tb':'')+'.vhd';a.click();URL.revokeObjectURL(a.href)}function goBack(){lesson.classList.remove('show');browse.style.display='block'}function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
const acts=C.filter(c=>['buffer','not','and','or','nand','nor','xor','xnor','mux2'].includes(c.id));let ac;
function newC2V(){ac=acts[Math.floor(Math.random()*acts.length)];cInputs.textContent=ac.inputs.join(', ');cGate.textContent=ac.name;cAns.value='';cFeed.textContent=''}function normal(s){return s.toLowerCase().replace(/\s/g,'')}function checkC2V(){let ok=normal(cAns.value)===normal(ac.stmt);cFeed.textContent=ok?'✓ Correct VHDL assignment!':'✗ Try again. Expected form: output <= expression;';cFeed.className=ok?'good':'bad'}function hintC2V(){cFeed.textContent='Hint: use the '+ac.id.toUpperCase()+' operator or conditional assignment.'}
function newV2C(){ac=acts[Math.floor(Math.random()*acts.length)];vCode.textContent=ac.stmt;vFeed.textContent='';vOptions.innerHTML=[...acts].sort(()=>Math.random()-.5).slice(0,5).concat(ac).filter((v,i,a)=>a.findIndex(x=>x.id===v.id)===i).slice(0,5).map(c=>`<button class="card" onclick="checkV2C('${c.id}')"><b>${c.name}</b></button>`).join('')}function checkV2C(id){let ok=id===ac.id;vFeed.textContent=ok?'✓ Correct circuit!':'✗ Read the operator or selected assignment again.';vFeed.className=ok?'good':'bad'}
const bank=[['Which operator implements equality detection?',['xor','xnor','nand'],1],['A testbench is used to…',['apply stimulus','create FPGA pins','replace architecture'],0],['A two-input truth table has…',['2 rows','4 rows','8 rows'],1],['Which assignment is AND?',['Y <= A and B;','Y <= A or B;','Y <= not A;'],0],['rising_edge(CLK) detects…',['LOW-to-HIGH transition','any input change','reset only'],0],['NAND is LOW for…',['00','01','11'],2],['A signal assignment uses…',['<=','==','++'],0],['The UUT means…',['unit under test','universal utility type','unsigned timing'],0],['A multiplexer select signal…',['chooses an input','stores data forever','creates a clock'],0],['Reset commonly…',['initializes stored state','adds two bits','inverts every input'],0],['XOR is HIGH when inputs are…',['different','equal','both zero only'],0],['The entity declares…',['ports','waveform colors','quiz scores'],0]];let quiz=[];function startQuiz(){quiz=[...bank].sort(()=>Math.random()-.5).slice(0,+qCount.value);qBox.innerHTML=quiz.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}<p id="f${i}"></p></div>`).join('')+'<button class="btn primary" onclick="grade()">Submit quiz</button>';qScore.textContent=''}function grade(){let n=0;quiz.forEach((q,i)=>{let p=document.querySelector(`input[name=q${i}]:checked`),ok=p&&+p.value===q[2];if(ok)n++;let f=document.getElementById('f'+i);f.textContent=!p?'Please answer.':ok?'✓ Correct':'✗ Correct answer: '+q[1][q[2]];f.className=ok?'good':'bad'});qScore.textContent=`Score: ${n}/${quiz.length} (${Math.round(n/quiz.length*100)}%)`}
document.querySelectorAll('#cats .tab').forEach(b=>b.onclick=()=>{document.querySelector('#cats .active').classList.remove('active');b.classList.add('active');render(b.dataset.cat)});document.querySelectorAll('#mainTabs .tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('#mainTabs .tab,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.view).classList.add('active');if(b.dataset.view==='c2v')newC2V();if(b.dataset.view==='v2c')newV2C()});render();startQuiz();
</script></body></html>
